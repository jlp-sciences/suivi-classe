<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi de classe</title>
<meta name="theme-color" content="#1E6B5C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --surface-2:#ECEAE5; --ink:#1B1E23; --ink-2:#3F444C; --muted:#5B6068;
  --line:#DDD9D1; --line-2:#C9C5BC;
  --pos:#1E6B5C; --pos-ink:#154C41; --pos-soft:#E3F0EC; --pos-line:#B9D8CF; --on-pos:#FFFFFF;
  --neg:#9A3F1B; --neg-ink:#7A3115; --neg-soft:#F7E7DF; --neg-line:#E6C3B3; --on-neg:#FFFFFF;
  --ph:#DAD5CB; --ph-ink:#6E675C; --scrim:rgba(27,30,35,.45); --shadow:0 12px 32px rgba(0,0,0,.18);
  --warn-soft:#FBF1D9; --warn-ink:#6B4A0B; --warn-line:#E9D39C;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15171A; --surface:#1E2125; --surface-2:#2A2E33; --ink:#EDEBE6; --ink-2:#CFCCC5; --muted:#A3A7AD;
    --line:#33373D; --line-2:#454A51;
    --pos:#5FB7A2; --pos-ink:#9ED8C8; --pos-soft:#1C332D; --pos-line:#2E5249; --on-pos:#0E1A17;
    --neg:#E08A63; --neg-ink:#F2B399; --neg-soft:#3A2419; --neg-line:#5A3525; --on-neg:#1E0F08;
    --ph:#2E3237; --ph-ink:#8E939A; --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5);
    --warn-soft:#3A3018; --warn-ink:#F0D597; --warn-line:#5E4E24;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15171A; --surface:#1E2125; --surface-2:#2A2E33; --ink:#EDEBE6; --ink-2:#CFCCC5; --muted:#A3A7AD;
  --line:#33373D; --line-2:#454A51;
  --pos:#5FB7A2; --pos-ink:#9ED8C8; --pos-soft:#1C332D; --pos-line:#2E5249; --on-pos:#0E1A17;
  --neg:#E08A63; --neg-ink:#F2B399; --neg-soft:#3A2419; --neg-line:#5A3525; --on-neg:#1E0F08;
  --ph:#2E3237; --ph-ink:#8E939A; --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5);
  --warn-soft:#3A3018; --warn-ink:#F0D597; --warn-line:#5E4E24;
}
[hidden]{display:none !important}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img{-webkit-user-drag:none;user-drag:none}
button img,.thumb img,.bigph img,.avatar img{pointer-events:none}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pos);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
h1,h2,h3{margin:0;text-wrap:balance}
.app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .grow{flex:1 1 auto}
.ttl{display:flex;flex-direction:column;gap:1px;min-width:0}
.ttl h1{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.15}
.ttl .sub{font-size:14px;color:var(--muted)}
.bar,.tabs,.foot{flex:none}
.main{flex:1 1 auto;min-height:0;overflow:auto;padding:20px 24px 24px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--line-2)}
.btn.primary{background:var(--pos);border-color:var(--pos);color:var(--on-pos);font-weight:600}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:600}
.btn.danger{background:var(--neg);border-color:var(--neg);color:var(--on-neg);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
.icon-btn{width:44px;height:44px;padding:0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:7px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.pos{background:var(--pos-soft);color:var(--pos-ink)}
.chip.neg{background:var(--neg-soft);color:var(--neg-ink)}
.chip.neu,.chip.abs{background:var(--surface-2);color:var(--ink-2)}
.chip.dark{background:var(--ink);color:var(--surface)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--warn-soft);color:var(--warn-ink);border:1px solid var(--warn-line);margin-bottom:14px}
.banner p{margin:0;flex:1 1 260px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* Aujourd'hui */
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.slot{width:100%;display:flex;align-items:center;gap:20px;padding:16px 22px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left}
.slot.now{border:2px solid var(--pos);box-shadow:0 4px 16px rgba(30,107,92,.14)}
.slot .time{width:150px;flex:none;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.slot .mid{flex:1 1 auto;display:flex;flex-direction:column;gap:3px;min-width:0}
.slot .cls{font-family:var(--serif);font-size:22px;font-weight:600}
.slot.now .cls{font-size:25px}
.slot .open{min-height:44px;padding:0 20px;border-radius:10px;background:var(--pos);color:var(--on-pos);font-weight:600;display:inline-flex;align-items:center}
.status{padding:4px 11px;border-radius:8px;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.status.now{background:var(--pos-soft);color:var(--pos-ink)}
.empty{text-align:center;padding:48px 16px;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--muted)}
.empty p{margin:0}
.welcome h2{font-family:var(--serif);font-size:24px;margin-bottom:8px}
.welcome ol{margin:0 0 16px;padding-left:20px;color:var(--ink-2)}

/* Aperçu de séance */
.hub{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.hub{grid-template-columns:1fr}}
.h2s{font-size:17px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.pgblk{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.pgblk:first-of-type{border-top:none}
.pgblk.cur{margin:6px 0;padding:0;border-radius:12px;border:2px solid var(--pos);overflow:hidden;gap:0}
button.pgblk{width:100%;text-align:left;background:transparent;border-left:none;border-right:none;border-bottom:none;font:inherit;color:inherit;cursor:pointer}
button.pgblk:not(.cur){border-radius:10px;margin:0 -8px;padding:10px 8px;width:calc(100% + 16px)}
button.pgblk:not(.cur):hover{background:var(--surface-2)}
button.pgblk.sel:not(.cur){background:var(--surface-2);box-shadow:inset 4px 0 0 var(--ink)}
button.pgblk.cur{border:2px solid var(--pos)}
button.pgblk.cur.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--pos) 35%,transparent)}
.curband{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:9px 12px;background:var(--pos);color:var(--on-pos)}
.curband .cb1{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.curband .cb2{font-family:var(--serif);font-size:19px;font-weight:600}
.curbody{padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--pos-soft)}
.pgmore{align-self:flex-end;font-size:13px;font-weight:600;color:var(--pos);margin-top:2px}
.pgnote{margin:6px 0 0;padding:6px 10px;border-left:3px solid var(--warn-line);background:var(--warn-soft);color:var(--warn-ink);border-radius:0 8px 8px 0;font-size:14px;white-space:pre-wrap}
.pgnote.big{font-size:16px;margin:0}
.hubcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.pgdetail{display:flex;flex-direction:column;gap:8px}
.pgdetail .lbl{margin-top:6px}
.pgdh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.pgdt{display:flex;flex-direction:column;min-width:0}
.pgdt strong{font-family:var(--serif);font-size:20px}
.pglist.big{font-size:16px;gap:8px}
.st-done{color:var(--pos)}
.pnote{display:block;width:100%;font-size:13px;color:var(--warn-ink);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pglist{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.pgrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 12px;border-radius:10px;background:var(--surface-2)}
.pgrow .pgblk{border-top:none;padding:0}
.chksec{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.chklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chk{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;background:var(--surface-2)}
.chk .thumb{width:40px;height:40px}
.chk .thumb .ini{font-size:14px}
.chk .cn{flex:1;display:flex;flex-direction:column;min-width:0}
.chk .btn{min-height:38px}
.chkbtn{margin-left:8px}
.tag-chk{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:#D9A52B;color:#1B1E23;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface)}
.pchk{padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn-ink);display:flex;flex-direction:column;gap:6px}
.pchkrow{justify-content:space-between;flex-wrap:nowrap}
.pchkrow .btn{min-height:36px;flex:none}
/* Contenu des séances */
.ity{display:inline-flex;align-items:center;padding:1px 9px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--tc) 18%,var(--surface));color:var(--ink)}
.ity.ev{background:var(--neg);color:var(--on-neg)}
.sesbar{margin-bottom:10px}
.plan-page > .sesbar{margin:0}
.ctbtn{max-width:100%;justify-content:flex-start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ctbtn.ct-empty{border-style:dashed;color:var(--ink-2);font-weight:500}
.banner.hw{background:var(--warn-soft)}
.sheet.wide{width:min(700px,100%)}
.ctlist,.hwlist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.ctitem{border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:6px}
.ctitem input{min-height:40px;flex:1 1 auto;min-width:0}
.seg.mini{padding:3px;gap:2px;flex-wrap:nowrap}
.seg.mini button{min-height:36px;padding:0 9px;font-size:13px}
.seg.mini button.st-done[aria-pressed="true"]{background:var(--pos);color:var(--on-pos);border-color:var(--pos)}
.seg.mini button.st-part[aria-pressed="true"]{background:#D9A52B;color:#1B1E23;border-color:#D9A52B}
.seg.mini button.st-not[aria-pressed="true"]{background:var(--neg);color:var(--on-neg);border-color:var(--neg)}
.reprow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 8px;border-radius:8px;background:var(--warn-soft);color:var(--warn-ink)}
.reprow .btn{min-height:36px;font-size:14px}
.hwitem{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;background:var(--surface-2)}
.hwitem > span:first-child{flex:1;font-weight:600}
.hwform{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.hwform select{width:auto;flex:0 1 240px}
.hwform input{flex:1 1 140px;width:auto}
.addty{min-height:38px;padding:0 10px;font-size:13px;border-color:color-mix(in srgb,var(--tc) 45%,var(--line))}
.check.other{padding:0 12px;border-radius:10px;background:var(--pos-soft);color:var(--pos-ink)}
.evb{align-self:flex-start;padding:0 6px;border-radius:5px;background:var(--neg);color:var(--on-neg);font-size:11px;font-weight:700}
.blk.short .evb{display:none}
.blk.has-eval .bg{color:var(--neg);font-weight:700}
.hwform .check{flex:0 0 auto;white-space:nowrap;min-height:40px}
.psep{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--surface-2);border-top:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2)}
.psep .btn{min-height:36px;font-size:14px}
.prow{width:100%;display:grid;grid-template-columns:110px 80px 56px minmax(0,2.2fr) minmax(0,1.4fr) 110px;align-items:center;gap:0 12px;padding:8px 16px;border:none;border-top:1px solid var(--line);background:transparent;text-align:left;font-size:14px;min-height:52px}
.prow .pi{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.prow .ph{display:flex;flex-direction:column;gap:2px;min-width:0}
.prow .hwl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.prow .hwl b{color:var(--ink);font-weight:600}
.prow .hwl.hwv b{color:#B07A12}
.prow .ps{text-align:right;font-weight:600}
.prow .ps.pos{color:var(--pos)}.prow .ps.warn{color:#B07A12}
.prow.is-cancel{opacity:.5}
.prow.more{display:block;text-align:center;color:var(--pos);font-weight:600;min-height:44px}
.st-part{color:#B07A12}.st-not{color:var(--neg)}
@media (max-width:900px){.prow{grid-template-columns:90px 64px 44px minmax(0,1fr) 90px}.prow .ph{display:none}}
/* Onglets */
.appbar{display:flex;align-items:stretch;gap:2px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);flex:none;min-height:56px;flex-wrap:wrap}
.appbar .brand{display:flex;align-items:center;font-family:var(--serif);font-size:19px;font-weight:600;margin-right:14px}
.appbar .tb{display:flex;align-items:center;padding:0 14px;border:none;border-bottom:3px solid transparent;background:transparent;color:var(--muted);font-weight:500;font-size:15px;min-height:56px}
.appbar .tb[aria-current="page"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.appbar .grow{flex:1}
.appbar > .btn{align-self:center}
@media (max-width:700px){
  .appbar{flex-wrap:nowrap;overflow-x:auto;padding:0 8px;scrollbar-width:none}
  .appbar::-webkit-scrollbar{display:none}
  .appbar .brand{display:none}
  .appbar .tb{padding:0 10px;font-size:14px;white-space:nowrap}
  .appbar .grow{display:none}
  .appbar .eye{padding:0 10px;font-size:0;gap:0;flex:none}
  .appbar .syncpill{flex:none;order:-1;margin-right:4px;padding:0 9px}
  .appbar .eye{order:-2;margin-right:4px}
  .appbar .syncpill .sl{display:none}
}
.eye{align-self:center}
.eye[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.gchip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.gchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
/* Suivi */
.stable-card{padding:0;overflow:hidden}
.srow{width:100%;display:grid;grid-template-columns:48px minmax(0,2fr) 44px 64px 64px 52px 52px minmax(0,2.4fr) 170px;align-items:center;gap:0 12px;padding:6px 16px;border:none;border-top:1px solid var(--line);background:transparent;text-align:left;font-size:15px;min-height:56px}
.srow.head{min-height:40px;border-top:none;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.srow .thumb{width:44px;height:44px}
.srow .thumb .ini{font-size:15px}
.srow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .num{text-align:right;font-variant-numeric:tabular-nums}
.srow .num.pos{color:var(--pos);font-weight:600}.srow .num.neg{color:var(--neg);font-weight:600}
.srow .last{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.srow .bdg{display:flex;gap:4px;justify-content:flex-end}
@media (max-width:900px){.srow{grid-template-columns:44px minmax(0,1fr) 36px 50px 50px 40px 40px 110px}.srow .last{display:none}}
/* Salles et plans */
.plan-wrap{display:flex;gap:16px;align-items:flex-start}
@media (max-width:820px){.plan-wrap{flex-direction:column;align-items:stretch}.plan-wrap > .unplaced{width:auto !important}.plan-wrap > .unplaced > .seat{display:inline-flex}}
.plan-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.room{position:relative;aspect-ratio:1000/620;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:100%;flex:none}
.room.grid-bg{background-image:radial-gradient(var(--line-2) 1.2px,transparent 1.2px);background-size:2% 3.2258%}
.board{position:absolute;background:var(--ink);color:var(--surface);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;border-radius:5px}
.board.top{left:30%;right:30%;top:.8%;height:4.2%}.board.bottom{left:30%;right:30%;bottom:.8%;height:4.2%}
.board.left{top:25%;bottom:25%;left:.6%;width:2.6%;writing-mode:vertical-rl}.board.right{top:25%;bottom:25%;right:.6%;width:2.6%;writing-mode:vertical-rl}
.desk{position:absolute;background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;font-size:11px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.it{position:absolute;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;gap:3px;padding:3px}
.it.double{background:var(--surface-2)}
.it.rot.double{flex-direction:row}
.it .glass{flex:none;height:5px;border-radius:3px;background:linear-gradient(90deg,#BFD9E6,#E3F0F6,#BFD9E6);border:1px solid #9EC3D6}
.it.rot .glass{height:auto;width:5px}
.un{flex:1 1 0;display:flex;flex-direction:column;gap:2px;min-height:0;min-width:0;border-radius:8px;padding:1px;background:var(--surface)}
.un.flag{box-shadow:0 0 0 2px #D9A52B;background:var(--warn-soft)}
.un.conf{box-shadow:0 0 0 2px var(--neg)}
.uh{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--ink-2);min-height:16px;padding:0 2px;white-space:nowrap;overflow:hidden;-webkit-touch-callout:none;user-select:none}
.uh .fl{padding:0 5px;border-radius:5px;background:var(--warn-soft);color:var(--warn-ink);border:1px solid var(--warn-line);font-weight:600}
.uh .fl.neg{background:var(--neg-soft);color:var(--neg-ink);border-color:var(--neg-line)}
.uh .note{margin-left:auto;border:none;background:transparent;color:var(--pos);font-weight:600;font-size:11px;padding:0 2px;min-height:18px}
.seats{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;gap:3px;min-height:0;position:relative}
.it.ilot .seats{grid-template-rows:1fr 1fr;row-gap:7px}
.it.ilot .seats::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--line-2);pointer-events:none}
.it.rot.ilot .seats{grid-auto-flow:column;row-gap:3px;column-gap:7px}
.it.rot.ilot .seats::after{left:50%;right:auto;top:0;bottom:0;width:2px;height:auto;margin:0 0 0 -1px}
.it.ilot6 .seats{grid-template-columns:1fr .65fr .65fr 1fr;grid-template-rows:1fr 1fr 1fr;grid-template-areas:"a t t d" "b t t e" "c c f f";gap:3px}

.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:var(--surface);border-radius:16px;z-index:31;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;display:flex;gap:12px;align-items:center;padding:10px 12px 10px 18px;border-radius:12px;background:var(--ink);color:var(--surface);font-size:15px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* Trombinoscope */
.tr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}

.stable select{width:auto;min-width:90px}
.filebtn{position:relative;overflow:hidden}

const Store = {
  db: null,
  async open() {
    if (!('indexedDB' in window)) return false;
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('suivi-classe', 1);
        r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos'); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
      });
      return true;
    } catch (e) { this.db = null; return false; }
  },
  run(name, mode, fn) {
    return new Promise((res, rej) => {
      if (!this.db) return res(null);
      try { const tx = this.db.transaction(name, mode); const out = fn(tx.objectStore(name)); tx.oncomplete = () => res(out && out.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }
      catch (e) { rej(e); }
    });
  },
  async load() {
    const core = await this.run('kv', 'readonly', s => s.get('db'));
    const photos = {};
    if (this.db) await new Promise((res, rej) => {
      const tx = this.db.transaction('photos', 'readonly'); const rq = tx.objectStore('photos').openCursor();
      rq.onsuccess = () => { const c = rq.result; if (c) { photos[c.key] = c.value; c.continue(); } };
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
    return {core, photos};
  },
  saveCore() { return this.run('kv', 'readwrite', s => s.put(JSON.parse(JSON.stringify(DB)), 'db')); },
  putPhoto(id, url) { return this.run('photos', 'readwrite', s => s.put(url, id)); },
  delPhoto(id) { return this.run('photos', 'readwrite', s => s.delete(id)); },
  async replaceAll() {
    if (!this.db) return;
    await this.run('photos', 'readwrite', s => s.clear());
    await new Promise((res, rej) => { const tx = this.db.transaction('photos', 'readwrite'); const st = tx.objectStore('photos'); Object.entries(PHOTOS).forEach(([k, v]) => st.put(v, k)); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    await this.saveCore();
  }
};

    <span class="chip dark" style="font-size:14px;padding:5px 12px">Semaine ${wt}</span>
    <span class="grow"></span>
    ${modeSeg('day')}
    <button class="btn" data-act="other">Autre classe</button>
  </header>
  <main class="main"><div class="wrap">${body}</div></main>`;
}
const modeSeg = m => isNarrow() ? '' : `<div class="seg" role="group" aria-label="Affichage"><button type="button" data-act="mode" data-m="day" aria-pressed="${m === 'day'}">Jour</button><button type="button" data-act="mode" data-m="week" aria-pressed="${m === 'week'}">Semaine</button></div>`;
function slotCard(d, s, FM) {
  const t = todayStr(), c = cls(s.cid), st = sesState(d, s, FM);
  const isNow = d === t && nowMin() >= tMin(s.start) && nowMin() < tMin(s.end);
  const n = studentsOf(s.cid, s.group).length;
  const chip = stateChip(st) || `<span class="status">${st.k === 'empty' ? 'Aucun élève' : 'À venir'}</span>`;
  const right = (isNow ? '<span class="status now">En cours</span>' : '') + chip + (isNow ? '<span class="open">Ouvrir</span>' : '');
  return `<li><button class="slot ${isNow ? 'now' : ''} ${d < t ? 'past' : ''}" data-act="open-slot" data-slot="${s.id}" data-date="${d}" data-long="slot">
    <span class="time">${fmtT(s.start)} – ${fmtT(s.end)}</span>
    <span class="mid"><span class="row" style="gap:10px">${dot(c)}<span class="cls">${esc(c.name)}</span><span class="chip neu">${groupLabel(s.group)}</span>${(() => { if (st.k === 'cancel') return ''; const rdy = DB.content[d + '|' + s.id] && DB.content[d + '|' + s.id].ready; return (hwDueAt(sesFromSlot(d, s)).length ? '<span class="dlab"><i class="pdot py"></i>Devoir</span>' : '') + `<span class="dlab">${cdtDot(d + '|' + s.id)}${DB.cdt[d + '|' + s.id] ? 'Cahier de textes' : 'Cahier de textes à faire'}</span>` + (rdy ? '<span class="dlab"><i class="pdot pg">✓</i>Prête</span>' : !sesStarted({date: d, start: s.start}) ? '<span class="dlab"><i class="pdot pr">!</i>À préparer</span>' : ''); })()}</span><span class="small muted">${plural(n, 'élève')}${(() => { const sm = contentSummary(DB.content[d + '|' + s.id], levelOf(c), false); return sm ? ' · ' + esc(sm) : ''; })()}</span></span>
    ${right}</button></li>`;
}

/* pastilles en bas à droite d'un créneau : jaune = devoir à vérifier · bleue = cahier de textes (! à compléter, ✓ complété) · verte = prête (! rouge = pas prête) */
const cdtDot = key => DB.cdt[key] ? '<i class="pdot pb" title="Cahier de textes complété">✓</i>' : '<i class="pdot pbx" title="Cahier de textes à compléter">!</i>';
/* séances commencées (non annulées) sans cahier de textes coché */
function cdtMissing() {
  let n = 0, first = null;
  DB.classes.forEach(c => classSessions(c.id).forEach(x => { if (x.extra || x.cancelled || !sesStarted(x) || DB.cdt[x.key]) return; n++; if (!first || x.date < first) first = x.date; }));
  return {n, first};
}
function slotDots(d, x, st) {
  if (st && st.k === 'cancel') return '';
  const ct = DB.content[d + '|' + x.id], ready = !!(ct && ct.ready), hw = hwDueAt(sesFromSlot(d, x)).length > 0;
  const pend = !ready && !sesStarted({date: d, start: x.start});
  return `<span class="bdots">${hw ? '<i class="pdot py" title="Devoir à vérifier"></i>' : ''}${cdtDot(d + '|' + x.id)}${ready ? '<i class="pdot pg" title="Séance prête">✓</i>' : pend ? '<i class="pdot pr" title="Séance pas encore prête">!</i>' : ''}</span>`;
}
/* ---------- vue : semaine ---------- */
function viewWeek() {
  const t = todayStr(), mon = mondayOf(V.date), FM = fillMap(), fd = focusDay();
  const wt = weekType(mon);
  const days = [0, 1, 2, 3, 4, 5].map(i => addDays(mon, i));
  const sat = DB.slots.some(x => x.day === 6 && (x.week === 'all' || x.week === wt) && cls(x.cid));
  const shown = sat ? days : days.slice(0, 5);
  const valid = DB.slots.filter(x => cls(x.cid));
  const t0 = valid.length ? Math.floor(Math.min(...valid.map(x => tMin(x.start))) / 60) * 60 : 480;
  const t1 = valid.length ? Math.ceil(Math.max(...valid.map(x => tMin(x.end))) / 60) * 60 : 1020;
  const nb = (IS_DEMO ? 1 : 0) + (backupDue() && !IS_DEMO ? 1 : 0) + (!STORAGE_OK && !IS_DEMO ? 1 : 0);
  const avail = window.innerHeight - 57 - 80 - 40 - 64 - 34 - nb * 84;
  const PPM = Math.max(0.8, Math.min(1.6, avail / Math.max(60, t1 - t0)));
  const H = (t1 - t0) * PPM;
  let todo = 0, started = 0;
  const cols = shown.map(d => {
    const hol = holidayOn(d), sl = slotsOn(d);
    const wd = parseD(d);
    const hi = d === fd;
    const head = `<div class="tt-dh ${hi ? 'today' : ''}">${DAYS[wd.getDay()].slice(0, 3)}. <b>${wd.getDate()}</b>${hi ? `<span class="tt-tag">${d === t ? "Aujourd'hui" : 'Prochain jour'}</span>` : ''}</div>`;
    /* ligne « maintenant », comme dans un agenda */
    const nm = nowMin(), nowLine = d === t && nm >= t0 && nm <= t1 ? `<div class="tt-now" style="top:${(nm - t0) * PPM}px" aria-hidden="true"></div>` : '';
    const pastShade = d === t && nm > t0 ? `<div class="tt-past" style="height:${Math.min(nm - t0, t1 - t0) * PPM}px" aria-hidden="true"></div>` : '';
    if (hol) return {head, body: `<div class="tt-col ${hi ? 'hi' : ''}" style="height:${H}px"><div class="tt-hol">${esc(hol.n)}</div>${nowLine}</div>`};
    // chevauchements : répartir côte à côte
    const lanes = []; sl.forEach(x => { let i = lanes.findIndex(end => end <= x.start); if (i < 0) { i = lanes.length; lanes.push(x.end); } else lanes[i] = x.end; x._lane = i; });
    const nl = Math.max(1, lanes.length);
    const blocks = sl.map(x => {
      const c = cls(x.cid), st = sesState(d, x, FM);
      if (st.k === 'none' || st.k === 'part') todo++;
      if (st.k !== 'future' && st.k !== 'cancel') started++;
      const isNow = d === t && nowMin() >= tMin(x.start) && nowMin() < tMin(x.end);
      const top = (tMin(x.start) - t0) * PPM, h = (tMin(x.end) - tMin(x.start)) * PPM - 4;
      const w = 100 / nl;
      const g = x.group === 'all' ? 'Classe entière' : 'Demi-groupe ' + x.group;
      return `<button class="blk ${hasEval(DB.content[d + '|' + x.id]) ? 'has-eval' : ''} ${d < t ? 'past' : ''} ${isNow ? 'now' : ''} ${st.k === 'cancel' ? 'cancel' : ''} ${h < 58 ? 'short' : ''}" style="top:${top}px;height:${h}px;left:calc(${x._lane * w}% + 2px);width:calc(${w}% - 4px);--cc:${ccol(c)}" data-act="open-slot" data-slot="${x.id}" data-date="${d}" data-long="slot" aria-label="${esc(c.name + ', ' + g + ', ' + fmtT(x.start))}">
        <span class="bc">${esc(c.name)}${x.group === 'all' ? '' : ` <span class="bgrp">${x.group}</span>`}${(() => { const ct = DB.content[d + '|' + x.id]; return ct && ct.ch != null ? ` <span class="bch">· ${esc(chapShort(levelOf(c), ct.ch))}</span>` : ''; })()}</span><span class="bg">${(() => { const ct = DB.content[d + '|' + x.id]; const ty = ct && ct.items.length ? [...new Set(ct.items.map(i => (ITYPE[i.type] || ITYPE.autre).l.replace(' / bilan', '')))].join(', ') : ''; return ty ? esc(ty) : fmtT(x.start) + ' – ' + fmtT(x.end); })()}</span>${hasEval(DB.content[d + '|' + x.id]) ? '<span class="evb">Évaluation</span>' : ''}${stateChip(st)}${slotDots(d, x, st)}</button>`;
    }).join('');
    return {head, body: `<div class="tt-col ${hi ? 'hi' : ''}" style="height:${H}px">${pastShade}${blocks}${nowLine}</div>`};
  });
  const hours = []; for (let m = t0; m <= t1; m += 60) hours.push(`<span style="top:${(m - t0) * PPM}px">${m / 60} h</span>`);
  const isCur = mon === mondayOf(fd);
  const miss = cdtMissing();
  const sub = `Semaine ${wt} · ` + (todo ? `<strong class="todo">${plural(todo, 'séance')} à compléter</strong>` : started ? 'Tout est à jour' : 'Aucune séance commencée')
    + `</div><div class="sub">` + (miss.n ? `<button type="button" class="cdtcount" data-act="cdt-first" data-date="${miss.first}" title="Aller à la première séance sans cahier de textes"><i class="pdot pbx">!</i> ${plural(miss.n, 'cahier de textes', 'cahiers de textes')} à compléter</button>` : '<span><i class="pdot pb">✓</i> Cahiers de textes à jour</span>');
  const wk = []; shown.forEach(d => { if (!holidayOn(d)) slotsOn(d).forEach(x => { const k = d + '|' + x.id; if (cls(x.cid) && !DB.cancelled[k]) wk.push(k); }); });
  const wkAll = wk.length && wk.every(k => DB.cdt[k]);
  const wkBtn = wk.length ? ` · <button type="button" class="cdtcount" data-act="cdt-week" data-keys="${wk.join(',')}" data-on="${wkAll ? '0' : '1'}" title="${wkAll ? 'Décocher le cahier de textes pour toute la semaine' : 'Cocher le cahier de textes pour toutes les séances de cette semaine'}">${wkAll ? 'Semaine cochée (décocher)' : 'Tout cocher pour la semaine'}</button>` : '';
  const endD = parseD(shown[shown.length - 1]);
  const title = `Du ${parseD(mon).getDate()} ${parseD(mon).getMonth() === endD.getMonth() ? '' : parseD(mon).toLocaleDateString('fr-FR', {month:'short'}) + ' '}au ${endD.toLocaleDateString('fr-FR', {day:'numeric', month:'long'})}`;
  let body = banners();
  if (!DB.classes.length) body += welcomeCard();
  else if (!valid.length) body += `<div class="empty"><p>Aucun créneau dans l'emploi du temps.</p><button class="btn" data-act="settings" data-tab="edt">${ICON.cal}Saisir l'emploi du temps</button></div>`;
  else body += `<div class="tt-wrap"><div class="tt" style="--n:${shown.length};--hour:${60 * PPM}px">
      <div></div>${cols.map(c => c.head).join('')}
      <div class="tt-times" style="height:${H}px">${hours.join('')}</div>${cols.map(c => c.body).join('')}
    </div></div>
    <p class="small muted legend" style="margin:0">Toucher un créneau : ouvrir la séance · Appui long : le marquer comme annulé · <i class="pdot py"></i> devoir à vérifier · <i class="pdot pbx">!</i><i class="pdot pb">✓</i> cahier de textes à compléter / complété · <i class="pdot pr">!</i> à préparer · <i class="pdot pg">✓</i> prête · Survol à la souris ou au stylet : aperçu, avec les cases à cocher</p>`;
  return `${tabBar('edt')}
  <header class="bar">
    <button class="btn icon-btn" data-act="week" data-n="-7" aria-label="Semaine précédente">${ICON.back}</button>
    <div class="ttl"><h1>${title}</h1><div class="sub">${sub}${wkBtn}</div></div>
    <button class="btn icon-btn" data-act="week" data-n="7" aria-label="Semaine suivante">${ICON.next}</button>
    ${isCur ? '' : '<button class="btn ghost" data-act="week" data-n="0">Cette semaine</button>'}
    <span class="grow"></span>
    ${modeSeg('week')}
    <button class="btn" data-act="other">Autre classe</button>
  </header>
  <main class="main"><div class="wrap" style="max-width:1280px">${body}</div></main>`;
}
function slotMenu(slotId, date) {
  const x = DB.slots.find(y => y.id === slotId); if (!x) return;
  const c = cls(x.cid), key = date + '|' + x.id, canc = !!DB.cancelled[key];
  openModal(`<h2 class="row" style="gap:10px">${dot(c)}${esc(c.name)} · ${groupLabel(x.group)}</h2>
    <p>${fmtLong(date)}, ${fmtT(x.start)} – ${fmtT(x.end)}${canc ? ' · <strong>séance annulée</strong>' : ''}</p>
    <p class="small muted">${canc ? 'Rétablir la séance la fera de nouveau apparaître comme à compléter.' : 'Une séance annulée (sortie, stage, absence…) ne compte plus comme à compléter.'}</p>
    <div class="ft"><button class="btn" data-act="m-close">Fermer</button>

    <button class="btn primary" data-act="open-slot" data-slot="${x.id}" data-date="${date}">Ouvrir la séance</button></div>`);
}
function welcomeCard() {

    <h2>Bienvenue</h2>
    <ol><li>Créez vos classes et importez vos listes d'élèves (avec leur demi-groupe).</li><li>Ajoutez les photos.</li><li>Saisissez votre emploi du temps : l'écran du jour s'affichera tout seul.</li></ol>
    <div class="row">
      <button class="btn primary" data-act="settings" data-tab="classes">Créer une classe</button>
      <span class="btn filebtn">Restaurer une sauvegarde<input type="file" accept=".txt,.json,text/plain,application/json" data-chg="restore" aria-label="Restaurer une sauvegarde"></span>

/* ---------- vue : grille ---------- */
function viewGrid() {
  const ses = V.ses, c = cls(ses.cid);
  const list = studentsOf(ses.cid, ses.group), sum = sesSummary(ses.key);
  const compact = list.length > 24;
  const ckAll = checkItems(ses), ckSet = new Set([...ckAll.catch.map(x => x.sid), ...ckAll.mat.map(x => x.sid), ...ckAll.dev.map(x => x.sid)]);
  let abs = 0, seen = 0;
  const tiles = list.map(s => {
    const r = sum[s.id] || {}; if (r.abs) abs++; else if (r.pos || r.neg || r.ras) seen++;
    const name = compact ? `${esc(s.first)} ${esc((s.last || '')[0] || '')}.` : `${esc(s.first)} <span>${esc(s.last)}</span>`;
    const chips = (r.pos ? `<span class="chip pos">+${r.pos}</span>` : '') + (r.neg ? `<span class="chip neg">−${r.neg}</span>` : '') + (r.dv ? `<span class="chip dv" title="${CAT[r.dv].l}">${compact ? 'Dev.' : 'Devoir'}</span>` : '') + (r.ras ? `<span class="chip neu">RAS</span>` : '');
    return `<button class="tile ${r.abs ? 'is-absent' : ''}" data-act="tile" data-long="fiche" data-sid="${s.id}" aria-label="${esc(s.first + ' ' + s.last)}">
      <span class="ph">${photoHTML(s)}${r.abs ? '<span class="chip dark tag-abs">Absent/e</span>' : ''}${ckSet.has(s.id) ? '<span class="tag-chk" title="À vérifier">!</span>' : ''}</span>
      <span class="nm">${name}</span><span class="cnt">${chips}</span></button>`;
  }).join('');
  const present = list.length - abs;
  const body = list.length ? `<div class="tiles ${compact ? 'compact' : ''}">${tiles}</div>`
    : `<div class="empty"><p>Aucun élève dans ${ses.group === 'all' ? 'cette classe' : 'ce demi-groupe'}.</p><button class="btn" data-act="settings" data-tab="classes" data-cid="${c.id}">Ajouter des élèves</button></div>`;
  return `${sesHeader(ses, `${eyeBtn(true)}
    <button class="btn" data-act="export" data-cid="${c.id}">${ICON.down}Export</button>
    <button class="btn" data-act="allactive">Tous actifs</button>
    <button class="btn primary" data-act="rasrest">${ICON.check}Reste de la classe : RAS</button>`)}
  <main class="main">${apprCard(ses)}${body}</main>
  <footer class="foot"><span>Toucher une photo : noter une observation (puis élève suivant)</span><span>Appui long : fiche de l'élève</span><span class="grow"></span><span>${present} présents · ${plural(abs, 'absent')} · ${Math.max(0, present - seen)} non observés</span></footer>`;
}

/* ---------- panneau d'observation ---------- */
let P = null;
function closeLayer() { $('#layer').innerHTML = ''; P = null; }
function openPanel(sid) { P = {sid, sel: new Set()}; renderPanel(); }
function openGroupPanel(sids, label) { P = {sids, label, sel: new Set()}; renderPanel(); }
function renderPanel() {
  if (P.sids) return renderGroupPanel();
  const s = stu(P.sid), ses = V.ses, c = cls(s.cid);
  const list = DB.obs.filter(o => o.ses === ses.key && o.sid === s.id);
  const isAbs = list.some(o => o.cat === 'absent');
  const catBtns = t => CATS.filter(x => x.t === t && !PANEL_HIDE.has(x.k)).map(x => `<button type="button" class="cat ${t}" data-act="p-tog" data-cat="${x.k}" aria-pressed="${P.sel.has(x.k)}">${esc(x.l)}</button>`).join('');
  const done = list.length ? `<div><div class="lbl" style="margin-bottom:6px">Déjà noté pendant cette séance</div><div class="done">${list.map(o => {
      const c2 = CAT[o.cat]; const sign = c2.t === 'pos' ? '+ ' : c2.t === 'neg' ? '− ' : '';
      return `<span class="chip ${DV.has(o.cat) ? 'dv' : c2.t}">${sign}${esc(c2.l)}<button type="button" data-act="p-del" data-oid="${o.id}" aria-label="Retirer ${esc(c2.l)}">×</button></span>`; }).join('')}</div></div>` : '';
  $('#layer').innerHTML = `<div class="scrim" data-act="p-close"></div>
  <aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="p-name">
    <div class="scroll">
      <div class="hd">
        <div class="avatar">${photoHTML(s)}</div>
        <div style="flex:1 1 140px;min-width:0"><h2 id="p-name">${esc(s.first + ' ' + s.last)}${amenIcons(s)}</h2><div class="small muted">${esc(c.name)}${s.group ? ' · ' + s.group : ''}</div></div>
        ${bilanMode() ? (() => { const pv = bilanStep(s.id, -1), nx = bilanStep(s.id, 1); const all = studentsOf(ses.cid, ses.group).filter(x => x.id === s.id || !isAbsentIn(ses.key, x.id)); const i = all.findIndex(x => x.id === s.id);
          return `<div class="pnav"><button class="btn icon-btn" data-act="p-step" data-d="-1" ${pv ? '' : 'disabled'} aria-label="Élève précédent">${ICON.back}</button><span class="small muted">${i + 1} / ${all.length}</span><button class="btn icon-btn" data-act="p-step" data-d="1" ${nx ? '' : 'disabled'} aria-label="Élève suivant">${ICON.next}</button></div>`; })() : ''}
        <button class="btn" data-act="p-fiche">Fiche</button>
        <button class="btn icon-btn ghost" data-act="p-close" aria-label="Fermer">${ICON.close}</button>
      </div>
      <div class="row"><button class="btn" data-act="p-ras">RAS</button><button class="btn" data-act="p-abs">${isAbs ? "Retirer l'absence" : 'Absent/e'}</button><button class="btn" data-act="p-catch">À rattraper…</button></div>
      ${(() => { const sc = studentChecks(ses, s.id); const n = sc.catch.length + sc.mat.length + sc.dev.length; if (!n) return '';
        return `<div class="pchk"><div class="lbl">À vérifier pour ${esc(s.first)}</div>${sc.catch.map(x => `<div class="row pchkrow"><span>${esc(catchText(x))}</span><button class="btn" data-act="catch-done" data-id="${x.id}">Rattrapé</button></div>`).join('')}${sc.dev.map(o => `<div class="row pchkrow"><span>${CAT[o.cat].l} le ${fmtShort(o.date)}</span><button class="btn" data-act="obs-seen" data-oid="${o.id}">Vu</button></div>`).join('')}${sc.mat.map(o => `<div class="row pchkrow"><span>Oubli de matériel le ${fmtShort(o.date)}</span><button class="btn" data-act="obs-seen" data-oid="${o.id}">Vu</button></div>`).join('')}</div>`; })()}
      ${done}
      <div><div class="sec-t pos">+ Positif</div><div class="cats">${catBtns('pos')}</div></div>
      <div><div class="sec-t neg">− Négatif</div><div class="cats">${catBtns('neg')}</div></div>
      <label class="f" for="p-note" style="display:block">Commentaire <span class="muted" style="font-weight:400">(facultatif, obligatoire pour « Comportement »)</span></label>
      <textarea id="p-note" rows="3" placeholder="Ce qui s'est passé…"></textarea>
      <p class="err" id="p-err" hidden></p>
    </div>
    <div class="ft"><button class="btn" data-act="p-close">Annuler</button><button class="btn ink" data-act="p-save" id="p-save" ${P.sel.size ? '' : 'disabled'}>Enregistrer</button></div>
  </aside>`;
}
function renderGroupPanel() {
  const ses = V.ses, studs = P.sids.map(stu).filter(Boolean);
  const catBtns = t => CATS.filter(x => x.t === t && !PANEL_HIDE.has(x.k)).map(x => `<button type="button" class="cat ${t}" data-act="p-tog" data-cat="${x.k}" aria-pressed="${P.sel.has(x.k)}">${esc(x.l)}</button>`).join('');

        <button class="btn icon-btn ghost" data-act="p-close" aria-label="Fermer">${ICON.close}</button></div>
      <div class="row">${studs.map(s => `<span class="avatar" style="width:56px;height:56px">${photoHTML(s)}</span>`).join('')}</div>
      <p class="small muted" style="margin:0">L'observation est enregistrée pour chacun (sauf les absents).</p>
      <div><div class="sec-t pos">+ Positif</div><div class="cats">${catBtns('pos')}</div></div>
      <div><div class="sec-t neg">− Négatif</div><div class="cats">${catBtns('neg')}</div></div>
      <label class="f" for="p-note" style="display:block">Commentaire <span class="muted" style="font-weight:400">(facultatif, obligatoire pour « Comportement »)</span></label>
      <textarea id="p-note" rows="3" placeholder="Ce qui s'est passé…"></textarea>

function viewFiche() {
  const s = stu(V.sid); if (!s) { back(); return ''; }

  if (V.p == null || V.p >= periods.length) V.p = currentPeriodIndex(periods);
  const per = periods[V.p];
  const obs = DB.obs.filter(o => o.sid === s.id && o.date >= per.s && o.date <= per.e).sort((a, b) => b.date.localeCompare(a.date) || b.t - a.t);
  const cnt = {}; obs.forEach(o => cnt[o.cat] = (cnt[o.cat] || 0) + 1);
  const tot = t => obs.filter(o => CAT[o.cat]?.t === t).length;
  const bars = CATS.filter(x => (x.t === 'pos' || x.t === 'neg') && cnt[x.k]).sort((a, b) => cnt[b.k] - cnt[a.k]);
  const max = Math.max(1, cnt.ras || 0, ...bars.map(b => cnt[b.k]));

        <div class="stat neg"><b>−${tot('neg')}</b><span>négatives</span></div>

function parseList(text, cid) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) return {rows: [], dup: 0};
  const sep = lines.some(l => l.includes('\t')) ? '\t' : lines.some(l => l.includes(';')) ? ';' : lines.some(l => l.includes(',')) ? ',' : null;
  let rows = lines.map(l => (sep ? l.split(sep) : [l]).map(x => x.replace(/^"|"$/g, '').trim()));
  if (/nom|pr[ée]nom|[ée]l[èe]ve/i.test(rows[0].join(' ')) && rows.length > 1) rows = rows.slice(1);
  const normG = g => { g = String(g || '').toUpperCase(); return /1/.test(g) ? 'G1' : /2/.test(g) ? 'G2' : ''; };
  const out = [];
  rows.forEach(r => {
    let last = '', first = '', group = '';
    const cells = r.filter(x => x !== '');
    if (!cells.length) return;
    if (cells.length >= 2 && !/^g?\s*[12]$/i.test(cells[1])) { last = cells[0]; first = cells[1]; group = normG(cells[2]); }
    else {
      const words = cells[0].split(/\s+/);
      const up = words.filter(w => w.length > 1 && w === w.toUpperCase() && /\p{L}/u.test(w));
      if (up.length && up.length < words.length) { last = up.join(' '); first = words.filter(w => !up.includes(w)).join(' '); }
      else { last = words.slice(-1).join(' '); first = words.slice(0, -1).join(' '); }
      if (cells[1]) group = normG(cells[1]);
    }
    if (!first || !last) return;
    out.push({last: titleCase(last), first: titleCase(first), group});
  });
  const have = new Set(DB.students.filter(s => s.cid === cid).map(s => norm(s.last + ' ' + s.first)));
  const fresh = out.filter(r => !have.has(norm(r.last + ' ' + r.first)));
  return {rows: fresh, dup: out.length - fresh.length};
}

const PDFJS_BASE = IS_DEMO ? 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/' : './';
let pdfjsReady = null;
const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('script')); document.head.appendChild(s); });
function loadPdfJs() {

const PARTICLE = /^(de|du|des|d'|d’|van|von|der|den|di|da|del|della|dos|el|ben|le|la)$/i;
function splitName(lines) {

  if (!clean.length) return {first: '', last: ''};
  const words = clean.join(' ').split(' ');
  const isUp = w => /\p{Lu}/u.test(w) && w === w.toUpperCase() && w.replace(/[^\p{L}]/gu, '').length > 1;
  const isLast = words.map((w, i) => isUp(w));
  for (let i = words.length - 2; i >= 0; i--) if (!isLast[i] && PARTICLE.test(words[i]) && isLast[i + 1]) isLast[i] = true;
  const nl = isLast.filter(Boolean).length;
  if (nl && nl < words.length) return {last: titleCase(words.filter((w, i) => isLast[i]).join(' ')), first: titleCase(words.filter((w, i) => !isLast[i]).join(' '))};
  if (clean.length >= 2) return {last: titleCase(clean[0]), first: titleCase(clean.slice(1).join(' '))};
  // Tout en majuscules sur une ligne (« NOM PRÉNOM ») : le nom est en premier ; une particule (DE, LA, VAN…) reste avec le nom.
  let k = 0; while (k < words.length - 2 && PARTICLE.test(words[k])) k++;

const toks = s => norm(s).split(' ').filter(Boolean);
function matchStudents(items, cands) {

  items.forEach((it, i) => {
    const t = new Set(toks(it.first + ' ' + it.last)); if (!t.size) return;
    cands.forEach(s => { const u = toks(s.first + ' ' + s.last); const inter = u.filter(x => t.has(x)).length; const sc = inter / Math.max(t.size, u.length); if (sc >= 0.5) pairs.push({i, s, sc}); });

async function readTrombi(file, onProgress) {

    const page = await pdf.getPage(pn);

    // 1. repérer les images et leur position
    const ops = await page.getOperatorList();

      const fn = ops.fnArray[k], a = ops.argsArray[k];

        const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
        const r = {x0: Math.min(...xs), y0: Math.min(...ys), x1: Math.max(...xs), y1: Math.max(...ys)};
        r.w = r.x1 - r.x0; r.h = r.y1 - r.y0;

      }
    }
    if (!rects.length) continue;
    const med = arr => { const b = arr.slice().sort((x, y) => x - y); return b[Math.floor(b.length / 2)]; };
    const mh = med(rects.map(r => r.h)), mw = med(rects.map(r => r.w));

      const [x, y] = vp1.convertToViewportPoint(it.transform[4], it.transform[5]);
      const fh = it.height || Math.hypot(it.transform[2], it.transform[3]) || 8;
      return {str: it.str.trim(), x0: x, x1: x + it.width, cy: y - fh / 2};

      const nm = splitName(txt);
      out.push({id: uid(), photo: squareCrop(cv, p.x0 * scale + 1, p.y0 * scale + 1, p.w * scale - 2, p.h * scale - 2), raw: txt.join(' '), first: nm.first, last: nm.last, sid: '', group: ''});

}

function detectLevelOld(name) {

const chapShort = (lvl, n) => { const c = chaptersOf(lvl).find(x => x.n === n); return 'Ch. ' + n + (c && c.t ? ' : ' + c.t : ''); };
const levelOf = c => (c && (c.level || detectLevel(c.name))) || '';

const compat = (a, b) => a === 'all' || b === 'all' || a === b;

/* toutes les séances d'une classe sur l'année (emploi du temps + séances hors EDT qui ont un contenu) */
let SESS_CACHE = {};
function classSessions(cid) {
  if (SESS_CACHE[cid]) return SESS_CACHE[cid];
  const out = [], yb = yearBounds();
  if (yb) for (let d = yb.s; d <= yb.e; d = addDays(d, 1)) {
    slotsOn(d).forEach(s => { if (s.cid === cid) out.push({key: d + '|' + s.id, date: d, start: s.start, end: s.end, group: s.group, slot: s.id, label: fmtT(s.start) + ' – ' + fmtT(s.end), cancelled: !!DB.cancelled[d + '|' + s.id]}); });
  }
  Object.keys(DB.content).forEach(k => {
    const p = k.split('|'); if (p[1] !== 'x' || p[2] !== cid) return;
    out.push({key: k, date: p[0], start: '99:99', end: '99:99', group: p[3], slot: null, label: 'Hors emploi du temps', cancelled: false, extra: true});
  });
  out.sort((a, b) => a.date.localeCompare(b.date) || a.start.localeCompare(b.start));

}
const sesStarted = s => { const t = todayStr(); return s.date < t || (s.date === t && (s.start === '99:99' || nowMin() >= tMin(s.start))); };
function nextSession(cid, key, group, sameTrack) {
  const list = classSessions(cid); const i = list.findIndex(s => s.key === key); if (i < 0) return null;
  return list.slice(i + 1).find(s => !s.cancelled && (sameTrack ? s.group === group : compat(s.group, group))) || null;
}
function firstSessionOnOrAfter(cid, date, group) { return classSessions(cid).find(s => !s.cancelled && s.date >= date && compat(s.group, group)) || null; }
/* séance pour laquelle un devoir est à faire (donné à la séance `from`) */
function hwTarget(h, from, cid, group) {

  return h.due ? firstSessionOnOrAfter(cid, h.due, group) : nextSession(cid, from.key, group, false);
}
const dayShort = d => parseD(d).toLocaleDateString('fr-FR', {weekday: 'short', day: 'numeric', month: 'short'});
function hwDueLabel(h, from, cid, group) { const t = hwTarget(h, from, cid, group); return t ? 'pour le ' + dayShort(t.date) : h.due ? 'pour le ' + dayShort(h.due) : 'pour la séance suivante'; }
/* séance prévue pour un devoir, sans tenir compte des annulations (pour savoir s'il a été décalé) */
function hwTargetRaw(h, from, cid, group) {
  const list = classSessions(cid);
  if (h.dueKey) { const t = list.find(x => x.key === h.dueKey); if (t && compat(t.group, group)) return t; }
  if (h.due) return list.find(x => x.date >= h.due && compat(x.group, group)) || null;

const repDest = (cid, key, g) => nextSession(cid, key, g, g === 'all');

function hwDueAt(ses) {

  list.forEach(p => {

    if (!compat(p.group, ses.group)) return;

function saveContent(fromCT) {

/* décaler : chaque séance suivante (même groupe) prend le contenu de la précédente */
function shiftAt(cid, group, startKey, firstContent) {
  const list = classSessions(cid).filter(s => !s.cancelled && s.group === group);
  const i = list.findIndex(s => s.key === startKey); if (i < 0) return 0;
  const after = list.slice(i);
  let last = -1; after.forEach((s, j) => { if (DB.content[s.key]) last = j; });
  const moving = after.slice(0, last + 1).map(s => DB.content[s.key] || null);
  if (last + 1 >= after.length && moving.length) { /* pas de séance libre à la fin de l'année : on garde le dernier contenu fusionné */
    const tail = moving.pop(); const prev = moving[moving.length - 1];
    if (prev && tail) { prev.items = prev.items.concat(tail.items); prev.hw = prev.hw.concat(tail.hw); }
  }
  after.forEach((s, j) => { if (j <= moving.length) delete DB.content[s.key]; });
  if (after[0] && firstContent) DB.content[after[0].key] = firstContent;
  moving.forEach((ct, j) => { const tgt = after[j + 1]; if (tgt && ct) DB.content[tgt.key] = ct; });
  SESS_CACHE = {};
  return moving.length;
}

  if (IS_DEMO || !syncConnected()) { if (manual) toast('Connectez d\'abord OneDrive (Réglages › Synchronisation).'); return; }
  if (SYNC.busy) { SYNC.again = true; return; }
  if (!navigator.onLine) { setSync('offline'); if (manual) toast('Pas de réseau : la synchronisation se fera au retour de la connexion.'); return; }
  if (!tokenUsable()) { setSync('relogin'); if (manual) msLogin(false); return; }
  SYNC.busy = true; setSync('run');
  try {
    if (!SYNC.rootOk) { const r = await gfetch(AR); if (!r.ok) throw syncErr('http', r.status); SYNC.rootOk = true; }
    let total = 0;
    for (let k = 0; k < 4; k++) {
      if (syncTrack()) SM.dirty = true;
      const item = await remoteItem(SYNC_FILE);
      if (item && item.eTag === SM.etag && !SM.dirty) break;
      let remote = null, got = {};
      if (item) {
        remote = JSON.parse(await gunz(await remoteBlob(item)));
        if (!remote || remote.app !== 'suivi-classe-sync') throw syncErr('format');
        await pool(photosToFetch(remote), 4, async sid => {
          const it = await remoteItem('p-' + sid + '.txt'); if (it) got[sid] = await (await remoteBlob(it)).text();
        });
      }
      const res = mergeWith(remote, got);
      if (res.changed) { total += res.changed; afterApply(0); }
      if (res.push) {
        await pool(res.pushPhotos.filter(sid => PHOTOS[sid]), 3, sid => remotePut('p-' + sid + '.txt', new Blob([PHOTOS[sid]], {type: 'text/plain'}), null, true));
        await pool(res.delPhotos, 3, sid => gfetch(`${AR}:/${encodeURIComponent('p-' + sid + '.txt')}`, {method: 'DELETE'}).catch(() => {}));
        const out = await remotePut(SYNC_FILE, await gz(JSON.stringify(res.push)), item && item.eTag);
        if (!out) continue; // l'autre appareil a écrit entre-temps : on recommence
        SM.etag = out.eTag;
      } else SM.etag = item ? item.eTag : null;
      SM.dirty = false; break;
    }
    const wasDue = !!backupDue();
    SM.last = Date.now(); await persistSM();
    setSync('ok');
    if (wasDue && V.name === 'today' && !$('#modal').innerHTML && !$('#layer').innerHTML) renderKeep();
    if (total && $('#toast').hidden) toast(`Mis à jour depuis l'autre appareil (${plural(total, 'modification')}).`);
    else if (manual) toast('Synchronisation terminée.');
  } catch (e) {
    persistSM();
    if (e.kind === 'relogin') setSync('relogin');
    else if (!e.kind || !navigator.onLine) setSync('offline');
    else setSync('err', e.kind === 'format' ? 'Fichier de synchronisation illisible.' : e.status === 403 ? 'Accès refusé par OneDrive.' : e.status === 507 ? 'OneDrive est plein.' : 'Erreur OneDrive' + (e.status ? ' (' + e.status + ')' : '') + '.');
    if (manual) toast(SYNC.state === 'relogin' ? 'Reconnexion à OneDrive nécessaire.' : SYNC.state === 'offline' ? 'Pas de réseau : nouvel essai plus tard.' : SYNC.msg);
  } finally {
    SYNC.busy = false;
    if (SYNC.again) { SYNC.again = false; setTimeout(() => syncNow(), 800); }
  }
}
let syncT = null;
function syncSoon(delay = 2500) {
  if (IS_DEMO) return; clearTimeout(syncT);
  syncT = setTimeout(() => { const ch = syncTrack(); if (ch) { SM.dirty = true; persistSM(); } if ((ch || SM.dirty) && syncConnected()) syncNow(); }, delay);
}

/* ---------- affichage de l'état ---------- */
const hm = t => { const d = new Date(t); return d.getHours() + ' h ' + pad(d.getMinutes()); };
function fmtSync(t) {
  if (!t) return 'jamais';
  const d = new Date(t), same = dstr(d) === todayStr();
  return same ? hm(t) : d.toLocaleDateString('fr-FR', {day: 'numeric', month: 'short'}) + ', ' + hm(t);
}
const fmtSyncLong = t => t ? cap(new Date(t).toLocaleDateString('fr-FR', {weekday: 'long', day: 'numeric', month: 'long'})) + ' à ' + hm(t) : 'jamais';
function setSync(state, msg) {
  SYNC.state = state; SYNC.msg = msg || '';
  const p = $('#sync-pill'); if (p) p.outerHTML = syncPill();
  const s = $('#sync-status'); if (s) s.outerHTML = syncStatusHTML();
}
function syncPill() {
  if (IS_DEMO || !syncCfg()) return '<span id="sync-pill" hidden></span>';
  if (!TOK.user) return `<button id="sync-pill" class="btn syncpill warn" data-act="settings" data-tab="sync">${ICON.sync}OneDrive non connecté</button>`;
  const st = SYNC.state, l = fmtSync(SM.last);
  const [cl, txt, act] = st === 'run' ? ['run', 'Synchronisation…', 'sync-now']
    : st === 'relogin' ? ['warn', 'Reconnecter OneDrive', 'sync-login']
    : st === 'offline' ? ['warn', 'Hors ligne · synchro ' + l, 'sync-now']
    : st === 'err' ? ['bad', 'Synchro en échec · ' + l, 'sync-now']
    : ['ok', 'Synchronisé · ' + l, 'sync-now'];
  const short = st === 'run' ? '…' : st === 'relogin' ? 'Reconnecter' : fmtSync(SM.last);
  return `<button id="sync-pill" class="btn syncpill ${cl}" data-act="${act}" title="Dernière synchronisation : ${esc(fmtSyncLong(SM.last))}">${ICON.sync}<span class="sl">${esc(txt)}</span><span class="ss">${esc(short)}</span></button>`;
}
function syncStatusHTML() {
  if (!syncConnected()) return '<div id="sync-status"></div>';
  const st = SYNC.state;
  const line = st === 'run' ? 'Synchronisation en cours…' : st === 'relogin' ? 'La connexion à OneDrive doit être renouvelée.' : st === 'offline' ? 'Pas de réseau pour le moment : les modifications seront envoyées au retour de la connexion.' : st === 'err' ? SYNC.msg : 'À jour.';
  return `<div id="sync-status" class="syncbox ${st === 'err' ? 'bad' : st === 'relogin' || st === 'offline' ? 'warn' : 'ok'}">
    <div><div class="lbl">Dernière synchronisation</div><div class="synclast">${esc(fmtSyncLong(SM.last))}</div><div class="small">${esc(line)}</div></div>
    <div class="row">${st === 'relogin' ? '<button class="btn ink" data-act="sync-login">Se reconnecter</button>' : `<button class="btn ink" data-act="sync-now" ${st === 'run' ? 'disabled' : ''}>${ICON.sync}Synchroniser maintenant</button>`}</div></div>`;
}
function setSync2() {
  if (IS_DEMO) return `<section class="card"><h3 style="font-size:17px">Synchronisation</h3><p class="muted">Indisponible dans la démo.</p></section>`;
  const cfg = syncCfg() || {}, con = syncConnected();
  const guide = `<details class="guide" ${cfg.client ? '' : 'open'}><summary>Première mise en place (une seule fois, environ 10 minutes)</summary><ol>
      <li>Sur l'ordinateur ou la tablette, ouvrez <strong>entra.microsoft.com</strong> et connectez-vous avec votre compte de l'établissement.</li>
      <li>Menu <strong>Applications › Inscriptions d'applications › Nouvelle inscription</strong>.</li>
      <li>Nom : <strong>Suivi de classe</strong>. Types de comptes : <strong>Comptes dans cet annuaire d'organisation uniquement</strong>.</li>
      <li>URI de redirection : choisissez <strong>Application monopage (SPA)</strong> et collez l'adresse ci-dessous. Cliquez sur <strong>Inscrire</strong>.</li>
      <li>Menu <strong>API autorisées › Ajouter une autorisation › Microsoft Graph › Autorisations déléguées</strong> : cochez <strong>Files.ReadWrite.AppFolder</strong>, puis « Ajouter des autorisations ».</li>
      <li>Revenez sur <strong>Vue d'ensemble</strong> : copiez l'<strong>ID d'application (client)</strong> et l'<strong>ID de l'annuaire (locataire)</strong> dans les deux cases ci-dessous.</li>
      <li>Touchez <strong>Se connecter à OneDrive</strong> et acceptez. Sur le téléphone : « Envoyer la configuration », puis connectez-vous.</li></ol>
      <p class="small muted">L'app n'a accès qu'à son propre dossier : <em>OneDrive › Applications › Suivi de classe</em>. Rien d'autre dans votre OneDrive.</p></details>`;
  return `<section class="card" style="display:flex;flex-direction:column;gap:12px">
      <h3 style="font-size:17px">Synchronisation OneDrive</h3>
      ${con ? `<p style="margin:0">Connecté : <strong>${esc(TOK.name || TOK.user)}</strong> <span class="small muted">${esc(TOK.name ? TOK.user : '')}</span></p>${syncStatusHTML()}
        <p class="small muted" style="margin:0">La synchronisation se fait à l'ouverture, quelques secondes après chaque modification et toutes les deux minutes. Ce qui est noté sur les deux appareils est additionné : rien n'est écrasé.</p>
        <div class="row"><button class="btn" data-act="sync-share">Envoyer la configuration à un autre appareil</button><button class="btn ghost" data-act="sync-logout">Se déconnecter</button></div>`
      : `<p style="margin:0" class="muted">Tablette et téléphone partagent les mêmes données, automatiquement, via votre OneDrive de l'établissement.</p>`}
    </section>
    <section class="card" style="display:flex;flex-direction:column;gap:10px">
      <h3 style="font-size:17px">Réglage</h3>
      ${guide}
      <label class="f">Adresse de retour (URI de redirection) à déclarer
        <span class="row" style="gap:8px;flex-wrap:nowrap"><input type="text" readonly value="${esc(redirectUri())}" id="sy-uri"><button class="btn" data-act="sy-copy">Copier</button></span></label>
      <label class="f" for="sy-client">ID d'application (client)<input type="text" id="sy-client" value="${esc(cfg.client || '')}" placeholder="ex. 3f2a…-…" autocomplete="off" spellcheck="false"></label>
      <label class="f" for="sy-tenant">ID de l'annuaire (locataire)<input type="text" id="sy-tenant" value="${esc(cfg.tenant || '')}" placeholder="ex. 8b1c…-…" autocomplete="off" spellcheck="false"></label>
      <div class="row"><button class="btn ink" data-act="sy-save">${con ? 'Enregistrer' : 'Se connecter à OneDrive'}</button>${cfg.client && !con ? '<button class="btn" data-act="sync-share">Envoyer la configuration à un autre appareil</button>' : ''}</div>
    </section>`;
}
/* lien de configuration reçu d'un autre appareil : …#sync=client.tenant */
function readSyncLink() {
  const m = /[#&]sync=([^&]+)/.exec(location.hash); if (!m) return false;
  const [client, tenant] = decodeURIComponent(m[1]).split('~');
  history.replaceState(null, '', location.pathname);
  if (client && tenant) { lsSet(SYNC_CFG_KEY, {client, tenant}); return true; }
  return false;
}
/* sauvegarde → fusion (sans rien écraser) */
function mergeBackupFile(file) {
  const r = new FileReader();
  r.onload = () => {
    let data; try { data = JSON.parse(r.result); } catch (e) { data = null; }
    if (!data || data.app !== 'suivi-classe' || !data.db) { toast("Ce fichier n'est pas une sauvegarde de Suivi de classe."); return; }
    const d = migrate(data.db), ph = data.photos || {}, R = recordsOf(d, ph), recs = {}, meta = {}, got = {};
    const sm = data.sync || {};
    for (const [p, v] of R) { const h = recHash(p, v); const x = sm[p]; meta[p] = x && !x.d && x.h === h ? x : {t: 0, h}; if (p.startsWith('photo:')) got[p.slice(6)] = v; else recs[p] = v; }
    Object.entries(sm).forEach(([p, x]) => { if (x.d && !meta[p]) meta[p] = x; });
    const before = JSON.stringify([DB.obs.length, DB.students.length]);
    const res = mergeWith({recs, meta}, got, {keepLocal: true});
    SM.dirty = true; if (STORAGE_OK) Store.saveCore().catch(() => {}); persistSM(); render();
    toast(res.changed ? `Sauvegarde fusionnée : ${plural(res.changed, 'élément')} ajouté${res.changed > 1 ? 's' : ''} ou mis à jour.` : 'Rien de nouveau dans cette sauvegarde.');
    if (syncConnected()) syncSoon(500);
  };
  r.readAsText(file);
}

/* ---------- aperçu d'une séance au survol (ordinateur) ---------- */
/* aperçu au survol : souris ou stylet (pas le doigt). Il reste ouvert quand on passe dessus, pour cocher « prête » / « cahier de textes ». */
let hovT = null, hovEl = null, hovOut = null, HOV = null;
function hideHover() { clearTimeout(hovT); clearTimeout(hovOut); hovT = hovOut = null; HOV = null; const el = $('#hovercard'); if (el) el.hidden = true; }
function sesPreviewHTML(d, x) {
  const c = cls(x.cid); if (!c) return '';
  const ses = {...sesFromSlot(d, x), start: x.start}, key = ses.key, ct = DB.content[key], lvl = levelOf(c);
  const cancelled = !!DB.cancelled[key], started = sesStarted({date: d, start: x.start});
  const items = itemsHTML(ct, started), due = cancelled ? [] : hwDueAt(ses);
  let h = `<div class="hvh">${dot(c)}<strong>${esc(c.name)}${x.group !== 'all' ? ' · ' + x.group : ''}</strong><span class="grow"></span>${ct && ct.ready && !cancelled ? '<span class="chip pos">Prête</span>' : ''}${apprChip(key)}</div>
    <div class="small muted">${cap(fmtDay(d))} · ${fmtT(x.start)} – ${fmtT(x.end)}${cancelled ? ' · <strong>annulé</strong>' : ''}</div>`;
  if (ct && ct.ch != null) h += `<div class="hvch">${esc(chapShort(lvl, ct.ch))}</div>`;
  if (items) h += `<ul class="pglist">${items}</ul>`;
  if (due.length) h += `<div class="hvsec"><span class="hwb">À vérifier</span><ul>${due.map(q => `<li>${esc(hwText(q.h))} <span class="small muted">(${dueMeta(q)})</span></li>`).join('')}</ul></div>`;
  if (ct && ct.hw.length) h += `<div class="hvsec"><span class="lbl" style="margin:0">Travail donné</span><ul>${ct.hw.map(q => `<li>${esc(hwText(q))} <span class="small muted">(${esc(hwDueLabel(q, ses, c.id, x.group))})</span></li>`).join('')}</ul></div>`;
  if (ct && ct.note) h += `<p class="pgnote">${esc(ct.note)}</p>`;
  if (!items && !(ct && ct.ch != null) && !due.length && !(ct && (ct.hw.length || ct.note))) h += '<p class="small muted" style="margin:6px 0 0">Rien de renseigné pour cette séance.</p>';
  if (!cancelled) { const rd = !!(ct && ct.ready), cd = !!DB.cdt[key];
    h += `<div class="hvtg"><button type="button" class="g" data-act="hv-ready" data-key="${key}" aria-pressed="${rd}">${rd ? '<i class="pdot pg">✓</i>Séance prête' : '<i class="pdot pr">!</i>Marquer prête'}</button><button type="button" class="b" data-act="hv-cdt" data-key="${key}" aria-pressed="${cd}">${cd ? '<i class="pdot pb">✓</i>Cahier de textes' : '<i class="pdot pbx">!</i>Cahier de textes'}</button></div>`; }
  return h;
}
function showHover(b) {
  if (!b.isConnected || $('#modal').innerHTML || $('#layer').innerHTML) return;
  const x = DB.slots.find(s => s.id === b.dataset.slot); if (!x) return;
  let el = $('#hovercard'); if (!el) { el = document.createElement('div'); el.id = 'hovercard'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Aperçu de la séance'); document.body.appendChild(el); }
  el.innerHTML = sesPreviewHTML(b.dataset.date, x); el.hidden = false; HOV = {slot: x.id, date: b.dataset.date};
  const r = b.getBoundingClientRect(), w = el.offsetWidth, hh = el.offsetHeight;
  const left = r.right + 10 + w < window.innerWidth ? r.right + 10 : Math.max(8, r.left - 10 - w);
  el.style.left = left + 'px'; el.style.top = Math.max(8, Math.min(r.top, window.innerHeight - hh - 8)) + 'px';
}
/* après « prête » / « cahier de textes » dans l'aperçu : on redessine l'emploi du temps et on garde l'aperçu ouvert */
function refreshHover() {
  const h = HOV; renderKeep(); if (!h) return;
  const b = document.querySelector(`[data-slot="${h.slot}"][data-date="${h.date}"]`); if (!b) return;
  hovEl = b; showHover(b);
}
document.addEventListener('pointerover', e => {
  if (e.pointerType === 'touch') return;
  if (e.target.closest && e.target.closest('#hovercard')) { clearTimeout(hovOut); hovOut = null; return; }
  const b = e.target.closest && e.target.closest('.blk[data-slot], .slot[data-slot]');
  if (b && b === hovEl) { clearTimeout(hovOut); hovOut = null; return; }
  if (!b && !hovEl) return;
  clearTimeout(hovT); hovT = null;
  const card = $('#hovercard'), open = card && !card.hidden;
  hovEl = b;
  if (b) { if (open) { clearTimeout(hovOut); hovOut = null; showHover(b); } else hovT = setTimeout(() => showHover(b), 600); }
  else if (open && !hovOut) hovOut = setTimeout(() => { hovEl = null; hideHover(); }, 350); // le temps de passer du créneau à l'aperçu
});
/* stylet qui s'éloigne de l'écran ou souris qui quitte la fenêtre */
document.addEventListener('pointerout', e => { if (e.pointerType !== 'touch' && !e.relatedTarget) { clearTimeout(hovT); hovT = null; if (!hovOut) hovOut = setTimeout(() => { hovEl = null; hideHover(); }, 900); } });
document.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('#hovercard')) return; hovEl = null; hideHover(); }, true);
['scroll', 'keydown'].forEach(ev => document.addEventListener(ev, e => { if (ev === 'scroll' && e.target && e.target.closest && e.target.closest('#hovercard')) return; hovEl = null; hideHover(); }, true));
document.addEventListener('scroll', () => hideAmen(), true);

/* ---------- démarrage ---------- */
async function init() {
  STORAGE_OK = await Store.open();
  if (STORAGE_OK) { try { const {core, photos} = await Store.load(); if (core) DB = migrate(core); PHOTOS = photos || {}; } catch (e) { STORAGE_OK = false; } }
  if (IS_DEMO && !DB.classes.length) { loadDemo(); if (STORAGE_OK) Store.replaceAll().catch(() => {}); }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if (!IS_DEMO && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if (!IS_DEMO && STORAGE_OK) { try { const sm = await Store.run('kv', 'readonly', s => s.get('sync')); if (sm && sm.m) SM = Object.assign(freshSM(), sm); } catch (e) {} }
  if (!IS_DEMO) syncTrack() && (SM.dirty = true), persistSM();
  const gotLink = !IS_DEMO && readSyncLink();
  /* connexion Microsoft à renouveler : on le fait discrètement à l'ouverture */
  if (syncConnected() && !tokenUsable() && navigator.onLine && !/[?&](code|error)=/.test(location.search)) {
    const last = lsGet(SILENT_KEY) || 0;
    if (Date.now() - last > 30 * 60e3) { lsSet(SILENT_KEY, Date.now()); if (!IS_DEMO) restoreNav(); msLogin(true); return; }
    SYNC.state = 'relogin';
  }
  const loggedNow = !IS_DEMO && await handleAuthRedirect();
  if (!DB.settings.catchInit && DB.classes.length) { backfillCatchups(); save(); }
  if (!IS_DEMO) restoreNav();
  render();
  if (DB.settings.appVersion !== APP_VERSION.n) {
    const first = !DB.settings.appVersion && !DB.classes.length;
    DB.settings.appVersion = APP_VERSION.n; save();
    if (!first && !IS_DEMO) toast(`Mise à jour installée : ${versionLabel().toLowerCase()}`);
  }
  setInterval(() => { if (V.name === 'today' && !$('#modal').innerHTML && document.visibilityState === 'visible') render(); }, 60000);
  if (gotLink) { STACK = []; V = {name: 'settings', tab: 'sync'}; render(); toast('Configuration OneDrive reçue : touchez « Se connecter à OneDrive ».'); }
  if (loggedNow && V.name === 'settings') render();
  if (syncConnected()) {
    if (SYNC.state === 'off') setSync('idle');
    syncNow();
    setInterval(() => { if (document.visibilityState === 'visible' && syncConnected()) syncNow(); }, 120000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && syncConnected() && Date.now() - SM.last > 20000) syncNow(); });
    window.addEventListener('online', () => { if (syncConnected()) syncNow(); });
    window.addEventListener('offline', () => { if (syncConnected()) setSync('offline'); });
  }
}
init();
