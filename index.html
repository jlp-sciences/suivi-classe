<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi de classe</title>
<meta name="theme-color" content="#1E6B5C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --surface-2:#ECEAE5; --ink:#1B1E23; --ink-2:#3F444C; --muted:#5B6068;
  --line:#DDD9D1; --line-2:#C9C5BC;
  --pos:#1E6B5C; --pos-ink:#154C41; --pos-soft:#E3F0EC; --pos-line:#B9D8CF; --on-pos:#FFFFFF;
  --neg:#9A3F1B; --neg-ink:#7A3115; --neg-soft:#F7E7DF; --neg-line:#E6C3B3; --on-neg:#FFFFFF;
  --ph:#DAD5CB; --ph-ink:#6E675C; --scrim:rgba(27,30,35,.45); --shadow:0 12px 32px rgba(0,0,0,.18);
  --warn-soft:#FBF1D9; --warn-ink:#6B4A0B; --warn-line:#E9D39C;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15171A; --surface:#1E2125; --surface-2:#2A2E33; --ink:#EDEBE6; --ink-2:#CFCCC5; --muted:#A3A7AD;
    --line:#33373D; --line-2:#454A51;
    --pos:#5FB7A2; --pos-ink:#9ED8C8; --pos-soft:#1C332D; --pos-line:#2E5249; --on-pos:#0E1A17;
    --neg:#E08A63; --neg-ink:#F2B399; --neg-soft:#3A2419; --neg-line:#5A3525; --on-neg:#1E0F08;
    --ph:#2E3237; --ph-ink:#8E939A; --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5);
    --warn-soft:#3A3018; --warn-ink:#F0D597; --warn-line:#5E4E24;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15171A; --surface:#1E2125; --surface-2:#2A2E33; --ink:#EDEBE6; --ink-2:#CFCCC5; --muted:#A3A7AD;
  --line:#33373D; --line-2:#454A51;
  --pos:#5FB7A2; --pos-ink:#9ED8C8; --pos-soft:#1C332D; --pos-line:#2E5249; --on-pos:#0E1A17;
  --neg:#E08A63; --neg-ink:#F2B399; --neg-soft:#3A2419; --neg-line:#5A3525; --on-neg:#1E0F08;
  --ph:#2E3237; --ph-ink:#8E939A; --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5);
  --warn-soft:#3A3018; --warn-ink:#F0D597; --warn-line:#5E4E24;
}
[hidden]{display:none !important}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img{-webkit-user-drag:none;user-drag:none}
button img,.thumb img,.bigph img,.avatar img{pointer-events:none}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pos);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
h1,h2,h3{margin:0;text-wrap:balance}
.app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .grow{flex:1 1 auto}
.ttl{display:flex;flex-direction:column;gap:1px;min-width:0}
.ttl h1{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.15}
.ttl .sub{font-size:14px;color:var(--muted)}
.bar,.tabs,.foot{flex:none}
.main{flex:1 1 auto;min-height:0;overflow:auto;padding:20px 24px 24px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--line-2)}
.btn.primary{background:var(--pos);border-color:var(--pos);color:var(--on-pos);font-weight:600}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:600}
.btn.danger{background:var(--neg);border-color:var(--neg);color:var(--on-neg);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
.icon-btn{width:44px;height:44px;padding:0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:7px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.pos{background:var(--pos-soft);color:var(--pos-ink)}
.chip.neg{background:var(--neg-soft);color:var(--neg-ink)}
.chip.neu,.chip.abs{background:var(--surface-2);color:var(--ink-2)}
.chip.dark{background:var(--ink);color:var(--surface)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--warn-soft);color:var(--warn-ink);border:1px solid var(--warn-line);margin-bottom:14px}
.banner p{margin:0;flex:1 1 260px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* Aujourd'hui */
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.slot{width:100%;display:flex;align-items:center;gap:20px;padding:16px 22px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left}
.slot.now{border:2px solid var(--pos);box-shadow:0 4px 16px rgba(30,107,92,.14)}
.slot .time{width:150px;flex:none;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.slot .mid{flex:1 1 auto;display:flex;flex-direction:column;gap:3px;min-width:0}
.slot .cls{font-family:var(--serif);font-size:22px;font-weight:600}
.slot.now .cls{font-size:25px}
.slot .open{min-height:44px;padding:0 20px;border-radius:10px;background:var(--pos);color:var(--on-pos);font-weight:600;display:inline-flex;align-items:center}
.status{padding:4px 11px;border-radius:8px;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.status.now{background:var(--pos-soft);color:var(--pos-ink)}
.empty{text-align:center;padding:48px 16px;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--muted)}
.empty p{margin:0}
.welcome h2{font-family:var(--serif);font-size:24px;margin-bottom:8px}
.welcome ol{margin:0 0 16px;padding-left:20px;color:var(--ink-2)}

/* Aperçu de séance */
.hub{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.hub{grid-template-columns:1fr}}
.h2s{font-size:17px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.pgblk{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.pgblk:first-of-type{border-top:none}
.pgblk.cur{background:var(--pos-soft);margin:0 -12px;padding:10px 12px;border-radius:10px;border-top:none}
.pglist{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.pgrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 12px;border-radius:10px;background:var(--surface-2)}
.pgrow .pgblk{border-top:none;padding:0}
.chksec{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.chklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chk{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;background:var(--surface-2)}
.chk .thumb{width:40px;height:40px}
.chk .thumb .ini{font-size:14px}
.chk .cn{flex:1;display:flex;flex-direction:column;min-width:0}
.chk .btn{min-height:38px}
.chkbtn{margin-left:8px}
.tag-chk{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:#D9A52B;color:#1B1E23;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface)}
.pchk{padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn-ink);display:flex;flex-direction:column;gap:6px}
.pchkrow{justify-content:space-between;flex-wrap:nowrap}
.pchkrow .btn{min-height:36px;flex:none}
/* Contenu des séances */
.ity{display:inline-flex;align-items:center;padding:1px 9px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--tc) 18%,var(--surface));color:var(--ink)}
.ity.ev{background:var(--neg);color:var(--on-neg)}
.sesbar{margin-bottom:10px}
.plan-page > .sesbar{margin:0}
.ctbtn{max-width:100%;justify-content:flex-start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ctbtn.ct-empty{border-style:dashed;color:var(--ink-2);font-weight:500}
.banner.hw{background:var(--warn-soft)}
.sheet.wide{width:min(700px,100%)}
.ctlist,.hwlist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.ctitem{border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:6px}
.ctitem input{min-height:40px;flex:1 1 auto;min-width:0}
.seg.mini{padding:3px;gap:2px;flex-wrap:nowrap}
.seg.mini button{min-height:36px;padding:0 9px;font-size:13px}
.seg.mini button.st-done[aria-pressed="true"]{background:var(--pos);color:var(--on-pos);border-color:var(--pos)}
.seg.mini button.st-part[aria-pressed="true"]{background:#D9A52B;color:#1B1E23;border-color:#D9A52B}
.seg.mini button.st-not[aria-pressed="true"]{background:var(--neg);color:var(--on-neg);border-color:var(--neg)}
.reprow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 8px;border-radius:8px;background:var(--warn-soft);color:var(--warn-ink)}
.reprow .btn{min-height:36px;font-size:14px}
.hwitem{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;background:var(--surface-2)}
.hwitem > span:first-child{flex:1;font-weight:600}
.hwform{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.hwform select{width:auto;flex:0 1 240px}
.hwform input{flex:1 1 140px;width:auto}
.addty{min-height:38px;padding:0 10px;font-size:13px;border-color:color-mix(in srgb,var(--tc) 45%,var(--line))}
.check.other{padding:0 12px;border-radius:10px;background:var(--pos-soft);color:var(--pos-ink)}
.evb{align-self:flex-start;padding:0 6px;border-radius:5px;background:var(--neg);color:var(--on-neg);font-size:11px;font-weight:700}
.blk.short .evb{display:none}
.blk.has-eval .bg{color:var(--neg);font-weight:700}
.hwform .check{flex:0 0 auto;white-space:nowrap;min-height:40px}
.psep{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--surface-2);border-top:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2)}
.psep .btn{min-height:36px;font-size:14px}
.prow{width:100%;display:grid;grid-template-columns:110px 80px 56px minmax(0,2.2fr) minmax(0,1.4fr) 110px;align-items:center;gap:0 12px;padding:8px 16px;border:none;border-top:1px solid var(--line);background:transparent;text-align:left;font-size:14px;min-height:52px}
.prow .pi{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.prow .ph{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .ps{text-align:right;font-weight:600}
.prow .ps.pos{color:var(--pos)}.prow .ps.warn{color:#B07A12}
.prow.is-cancel{opacity:.5}
.prow.more{display:block;text-align:center;color:var(--pos);font-weight:600;min-height:44px}
.st-part{color:#B07A12}.st-not{color:var(--neg)}
@media (max-width:900px){.prow{grid-template-columns:90px 64px 44px minmax(0,1fr) 90px}.prow .ph{display:none}}
/* Onglets */
.appbar{display:flex;align-items:stretch;gap:2px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);flex:none;min-height:56px;flex-wrap:wrap}
.appbar .brand{display:flex;align-items:center;font-family:var(--serif);font-size:19px;font-weight:600;margin-right:14px}
.appbar .tb{display:flex;align-items:center;padding:0 14px;border:none;border-bottom:3px solid transparent;background:transparent;color:var(--muted);font-weight:500;font-size:15px;min-height:56px}
.appbar .tb[aria-current="page"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.appbar .grow{flex:1}
.eye{align-self:center}
.eye[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.gchip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.gchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
/* Suivi */
.stable-card{padding:0;overflow:hidden}
.srow{width:100%;display:grid;grid-template-columns:48px minmax(0,2fr) 44px 64px 64px 52px 52px minmax(0,2.4fr) 170px;align-items:center;gap:0 12px;padding:6px 16px;border:none;border-top:1px solid var(--line);background:transparent;text-align:left;font-size:15px;min-height:56px}
.srow.head{min-height:40px;border-top:none;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.srow .thumb{width:44px;height:44px}
.srow .thumb .ini{font-size:15px}
.srow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .num{text-align:right;font-variant-numeric:tabular-nums}
.srow .num.pos{color:var(--pos);font-weight:600}.srow .num.neg{color:var(--neg);font-weight:600}
.srow .last{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.srow .bdg{display:flex;gap:4px;justify-content:flex-end}
@media (max-width:900px){.srow{grid-template-columns:44px minmax(0,1fr) 36px 50px 50px 40px 40px 110px}.srow .last{display:none}}
/* Salles et plans */
.plan-wrap{display:flex;gap:16px;align-items:flex-start}
@media (max-width:820px){.plan-wrap{flex-direction:column;align-items:stretch}.plan-wrap > .unplaced{width:auto !important}.plan-wrap > .unplaced > .seat{display:inline-flex}}
.plan-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.room{position:relative;aspect-ratio:1000/620;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:100%;flex:none}
.room.grid-bg{background-image:radial-gradient(var(--line-2) 1.2px,transparent 1.2px);background-size:2% 3.2258%}
.board{position:absolute;background:var(--ink);color:var(--surface);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;border-radius:5px}
.board.top{left:30%;right:30%;top:.8%;height:4.2%}.board.bottom{left:30%;right:30%;bottom:.8%;height:4.2%}
.board.left{top:25%;bottom:25%;left:.6%;width:2.6%;writing-mode:vertical-rl}.board.right{top:25%;bottom:25%;right:.6%;width:2.6%;writing-mode:vertical-rl}
.desk{position:absolute;background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;font-size:11px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.it{position:absolute;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;gap:3px;padding:3px}
.it.double{background:var(--surface-2)}
.it.rot.double{flex-direction:row}
.it .glass{flex:none;height:5px;border-radius:3px;background:linear-gradient(90deg,#BFD9E6,#E3F0F6,#BFD9E6);border:1px solid #9EC3D6}
.it.rot .glass{height:auto;width:5px}
.un{flex:1 1 0;display:flex;flex-direction:column;gap:2px;min-height:0;min-width:0;border-radius:8px;padding:1px;background:var(--surface)}
.un.flag{box-shadow:0 0 0 2px #D9A52B;background:var(--warn-soft)}
.un.conf{box-shadow:0 0 0 2px var(--neg)}
.uh{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--ink-2);min-height:16px;padding:0 2px;white-space:nowrap;overflow:hidden;-webkit-touch-callout:none;user-select:none}
.uh .fl{padding:0 5px;border-radius:5px;background:var(--warn-soft);color:var(--warn-ink);border:1px solid var(--warn-line);font-weight:600}
.uh .fl.neg{background:var(--neg-soft);color:var(--neg-ink);border-color:var(--neg-line)}
.uh .note{margin-left:auto;border:none;background:transparent;color:var(--pos);font-weight:600;font-size:11px;padding:0 2px;min-height:18px}
.seats{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;gap:3px;min-height:0;position:relative}
.it.ilot .seats{grid-template-rows:1fr 1fr;row-gap:7px}
.it.ilot .seats::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--line-2);pointer-events:none}
.it.rot.ilot .seats{grid-auto-flow:column;row-gap:3px;column-gap:7px}
.it.rot.ilot .seats::after{left:50%;right:auto;top:0;bottom:0;width:2px;height:auto;margin:0 0 0 -1px}
.it.simple .seats{grid-template-rows:1fr}
.it.rot.simple .seats,.it.rot.double .seats{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
.seat{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0;display:flex;align-items:center;gap:4px;overflow:hidden;text-align:left;min-width:0;min-height:0;color:var(--ink);-webkit-touch-callout:none;user-select:none}
.seat .sp{width:30px;align-self:stretch;flex:none;background:var(--ph);display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:28px}
.seat .sp img{width:100%;height:100%;object-fit:cover}
.seat .sp .ini{font-size:12px}
.seat .st{display:flex;flex-direction:column;gap:1px;min-width:0;padding-right:3px}
.seat .sn{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .sc{display:flex;gap:2px;flex-wrap:nowrap}
.seat .sc .chip{font-size:10px;padding:0 4px;border-radius:4px}
.seat.empty{border-style:dashed;background:transparent;justify-content:center;color:var(--muted);font-size:11px}
.seat.ghost{background:var(--surface-2);border-color:var(--line)}
.seat.drop{background:var(--pos-soft);border-color:var(--pos-line);color:var(--pos-ink);font-weight:600}
.seat.is-absent{opacity:.45}
.seat.sel{outline:3px solid var(--ink);outline-offset:1px;z-index:1}
.unplaced{width:190px;flex:none;display:flex;flex-direction:column;gap:6px}
.unplaced > .seat{min-height:46px}
.unplaced .btn,.unplaced .card .btn{white-space:normal;text-align:left;height:auto;padding-block:8px;line-height:1.25}
.room.names .seat .sp{display:none}
.plan-page{gap:8px}
.plan-page > .banner{padding:6px 12px;margin:0;font-size:14px;gap:8px}
.plan-page > .banner .btn{min-height:36px;padding:0 12px;font-size:14px}
.seat{container-type:inline-size}
@container (max-width: 88px){.seat .sp{display:none}.seat .st{padding-left:4px}}
.room.names .seat{justify-content:center;padding:0 3px}
.room.names .seat .sn{font-size:12px}
.unplaced > .seat .sp{width:44px}
.ptools{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.banner.bad{background:var(--neg-soft);color:var(--neg-ink);border-color:var(--neg-line)}
.banner.ok{background:var(--pos-soft);color:var(--pos-ink);border-color:var(--pos-line)}
.it.edit{cursor:grab;touch-action:none}
.it.edit.selected{box-shadow:0 0 0 3px #2F6DB5;z-index:2}
.desk.edit{cursor:grab;touch-action:none}
.roomcard{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;min-height:56px}
.roomcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.rc-t{display:flex;flex-direction:column;gap:1px;font-size:13px;color:var(--muted)}.rc-t b{font-size:16px;color:var(--ink)}
.mini{position:relative;width:84px;aspect-ratio:1000/620;background:var(--surface-2);border-radius:5px;overflow:hidden;flex:none;border:1px solid var(--line)}
.mini i{position:absolute;background:var(--line-2);border-radius:2px}
.roomb{min-height:60px;flex-direction:column;gap:0;font-size:17px;font-weight:600}
.roomb .small{font-weight:400;opacity:.8}
/* Projection (toujours claire pour le vidéoprojecteur) */
.proj{position:fixed;inset:0;background:#FFFFFF;color:#1B1E23;display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 24px;z-index:50;color-scheme:light}
.proj-h{align-self:stretch;display:flex;align-items:baseline;gap:16px}
.proj-h h1{font-family:var(--serif);font-size:clamp(24px,3.4vw,44px);font-weight:600}
.proj-h > span{font-size:clamp(16px,1.8vw,24px);color:#5B6068}
.proj-h .grow{flex:1}
.proj-x{align-self:center;min-height:40px;border-color:#ECEAE5;background:#FFFFFF;color:#8A8F96;font-size:13px}
.proj .room{--surface:#FFFFFF;--surface-2:#F3F1EC;--line:#DDD9D1;--line-2:#A9A499;--ink:#1B1E23;--ink-2:#3F444C;--muted:#8A8F96}
.proj .seat{justify-content:center;background:#F3F1EC;border-color:#DDD9D1}
.proj .seat.empty{background:transparent}
.proj .seat .sn{font-size:clamp(11px,1.45vw,21px)}
.proj .uh{font-size:clamp(10px,1.1vw,15px)}
.proj .board{font-size:clamp(10px,1.1vw,15px)}
/* Semaine */
.chip.warn{background:var(--warn-soft);color:var(--warn-ink)}
/* devoirs (jaune) et appréciation de classe */
.chip.dv{background:#F6D45A;color:#3D3000}
.chip.appr-dyn{background:var(--pos);color:var(--on-pos)}
.chip.appr-bien{background:var(--pos-soft);color:var(--pos-ink)}
.chip.appr-passive{background:var(--warn-soft);color:var(--warn-ink);border:1px solid var(--warn-line)}
.chip.appr-penible{background:var(--neg);color:var(--on-neg)}
.tile.dv-on{border:3px solid #E2B41B;background:#FFF4C2;box-shadow:0 0 0 1px #E2B41B}
.tile.dv-on .nm{color:#3D3000}
.dv-tag{position:absolute;left:6px;bottom:6px;padding:3px 9px;border-radius:8px;background:#F6D45A;color:#3D3000;font-weight:700;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.dv-tiles .tile{padding-bottom:8px}
.dvpick .dvb{min-height:56px;font-size:16px}
.dvpick .dvb[aria-pressed="true"]{background:#F6D45A;color:#3D3000;border-color:#E2B41B}
.stabs{gap:6px}
.stabs button{min-height:52px;padding:0 20px;font-size:16px;display:inline-flex;align-items:center;gap:8px}
.stabs .bd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;font-size:12px;font-weight:700}
.stabs .bd.warn{background:#D9A52B;color:#1B1E23}
.stabs .bd.dv{background:#F6D45A;color:#3D3000}
.stabs .bd.ok{background:var(--pos-soft);color:var(--pos-ink)}
.stabs .bd.dot{min-width:10px;width:10px;height:10px;padding:0;background:#E2B41B}
.apprbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.seg.appr button{min-height:44px;padding:0 16px;font-size:15px}
.seg.appr button.appr-dyn[aria-pressed="true"]{background:var(--pos);color:var(--on-pos);border-color:var(--pos)}
.seg.appr button.appr-bien[aria-pressed="true"]{background:var(--pos-soft);color:var(--pos-ink);border-color:var(--pos-line)}
.seg.appr button.appr-passive[aria-pressed="true"]{background:#D9A52B;color:#1B1E23;border-color:#D9A52B}
.seg.appr button.appr-penible[aria-pressed="true"]{background:var(--neg);color:var(--on-neg);border-color:var(--neg)}
.pnav{display:flex;align-items:center;gap:6px}
.prow.is-now{background:color-mix(in srgb,var(--pos) 10%,var(--surface));box-shadow:inset 5px 0 0 var(--pos)}
.nowtag{display:inline-block;margin-bottom:3px;padding:1px 8px;border-radius:6px;background:var(--pos);color:var(--on-pos);font-size:12px;font-weight:700}
.todo{color:var(--neg);font-weight:600}
.cdot{display:inline-block;width:12px;height:12px;border-radius:4px;flex:none}
.slot.past{background:var(--surface-2)}
.slot.past .cls,.slot.past .time{color:var(--muted)}
.tt-wrap{overflow-x:auto;padding-bottom:4px}
.tt{display:grid;grid-template-columns:48px repeat(var(--n),minmax(130px,1fr));column-gap:8px;row-gap:8px}
.tt-dh{padding:6px 8px;border-radius:10px;text-align:center;font-size:14px;color:var(--muted)}
.tt-dh b{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.tt-dh.today{background:var(--ink);color:var(--surface)}
.tt-dh.today b{color:var(--surface)}
.tt-times{position:relative}
.tt-times span{position:absolute;right:2px;transform:translateY(-50%);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tt-times span:first-child{transform:none}
.tt-col{position:relative;border-radius:10px;background-color:var(--surface);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hour));border:1px solid var(--line)}
.tt-hol{position:absolute;inset:0;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:14px;font-weight:500;color:var(--muted)}
.blk{position:absolute;padding:8px 8px 6px;border-radius:9px;border:1px solid color-mix(in srgb,var(--cc) 40%,transparent);background:color-mix(in srgb,var(--cc) 17%,var(--surface));box-shadow:inset 0 4px 0 var(--cc);text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.blk .bc{font-weight:700;font-size:15px;line-height:1.15;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .bg{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .chip{align-self:flex-start;font-size:12px;padding:1px 7px;margin-top:auto}
.blk.short{padding:5px 7px 4px;gap:0}
.blk.short .bc{font-size:14px}
.blk.short .bg{font-size:11px}
.blk.short .chip{font-size:10px;padding:0 5px}
.bgrp{font-weight:600;font-size:12px;padding:0 5px;border-radius:5px;background:color-mix(in srgb,var(--cc) 30%,var(--surface));color:var(--ink);vertical-align:1px}
.blk.past{background:color-mix(in srgb,var(--cc) 8%,var(--surface-2));border-color:var(--line);box-shadow:inset 0 4px 0 color-mix(in srgb,var(--cc) 75%,var(--surface-2))}
.blk.past .bc,.blk.past .bg{color:var(--muted)}
.blk.now{outline:3px solid var(--ink);outline-offset:1px;z-index:1}
.blk.cancel{background:repeating-linear-gradient(135deg,var(--surface-2) 0 8px,var(--surface) 8px 16px);border-style:dashed;box-shadow:none}
.blk.cancel .bc{text-decoration:line-through;color:var(--muted)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid var(--surface);background:var(--sw);box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
/* Grille */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;align-content:start}
.tiles.compact{grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:10px}
.tile{padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;text-align:left;display:flex;flex-direction:column;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile .ph{position:relative;aspect-ratio:5/4;background:var(--ph);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tiles.compact .tile .ph{aspect-ratio:3/2}
.ph img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ini{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--ph-ink)}
.tiles.compact .ini{font-size:24px}
.tile .nm{padding:7px 9px 0;font-size:14px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .nm span{font-weight:400;color:var(--muted)}
.tile .cnt{display:flex;gap:4px;padding:5px 9px 9px;min-height:31px}
.tile.is-absent{opacity:.5}
.tag-abs{position:absolute;top:6px;left:6px}
.foot{display:flex;gap:18px;flex-wrap:wrap;padding:10px 24px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);background:var(--surface)}
.foot .grow{flex:1}

/* Panneau */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .scroll{flex:1 1 auto;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.sheet .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.avatar{width:72px;height:72px;border-radius:12px;background:var(--ph);overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.sheet h2{font-family:var(--serif);font-size:23px;font-weight:600}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cat{min-height:46px;padding:4px 8px;border-radius:10px;font-size:15px;font-weight:500;line-height:1.15}
.cat.pos{border:1px solid var(--pos-line);background:var(--pos-soft);color:var(--pos-ink)}
.cat.neg{border:1px solid var(--neg-line);background:var(--neg-soft);color:var(--neg-ink)}
.cat.pos[aria-pressed="true"]{background:var(--pos);border-color:var(--pos);color:var(--on-pos);font-weight:600;box-shadow:inset 0 0 0 2px var(--pos-ink)}
.cat.neg[aria-pressed="true"]{background:var(--neg);border-color:var(--neg);color:var(--on-neg);font-weight:600;box-shadow:inset 0 0 0 2px var(--neg-ink)}
.sec-t{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
.sec-t.pos{color:var(--pos)} .sec-t.neg{color:var(--neg)}
textarea,input[type=text],input[type=date],input[type=time],select{width:100%;min-height:44px;padding:9px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
textarea{resize:vertical;min-height:80px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:var(--ink-2)}
.err{margin:0;color:var(--neg);font-size:14px;font-weight:500}
.sheet .ft{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line)}
.done{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.done .chip button{border:none;background:transparent;padding:0 0 0 4px;min-width:24px;min-height:24px;color:inherit;font-size:15px;line-height:1}

/* Modal */
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:var(--surface);border-radius:16px;z-index:31;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.modal h2{font-family:var(--serif);font-size:22px}
.modal p{margin:0}
.modal .ft{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.scrim.m{z-index:30}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.pick button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2);flex-wrap:wrap}
.seg button{min-height:40px;padding:0 14px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--ink-2);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);border-color:var(--line)}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;display:flex;gap:12px;align-items:center;padding:10px 12px 10px 18px;border-radius:12px;background:var(--ink);color:var(--surface);font-size:15px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
#toast button{min-height:40px;border:none;border-radius:8px;padding:0 12px;background:transparent;color:var(--surface);font-weight:700;text-decoration:underline}

/* Fiche */
.fiche{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.fiche{grid-template-columns:1fr}}
.bigph{aspect-ratio:1/1;border-radius:14px;background:var(--ph);overflow:hidden;display:flex;align-items:center;justify-content:center}
.bigph img{width:100%;height:100%;object-fit:cover}
.bigph .ini{font-size:72px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:12px 14px;border-radius:12px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line)}
.stat b{font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat.pos{background:var(--pos-soft);border-color:transparent;color:var(--pos-ink)}
.stat.neg{background:var(--neg-soft);border-color:transparent;color:var(--neg-ink)}
.stat span{font-size:14px}
.bars{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:150px minmax(0,1fr) 28px;align-items:center;gap:10px;font-size:14px}
.barrow .tr{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.barrow .fl{height:100%;border-radius:6px}
.fl.pos{background:var(--pos)} .fl.neg{background:var(--neg)}
.barrow b{font-variant-numeric:tabular-nums;text-align:right}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.log .d{width:88px;flex:none;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.log .n{flex:1 1 200px;font-size:14px;color:var(--ink-2)}
.log .x{min-height:36px;padding:0 10px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:13px}
.log .x.confirm{border-color:var(--neg);color:var(--neg);font-weight:600}

/* Trombinoscope */
.tr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tr-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.tr-card.is-skip{opacity:.5}
.tr-ph{aspect-ratio:1/1;background:var(--ph)}
.tr-ph img{width:100%;height:100%;object-fit:cover;display:block}
.tr-body{padding:10px;display:flex;flex-direction:column;gap:8px}
.tr-raw{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-names{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tr-body .seg button{min-height:36px;padding:0 12px}
/* Réglages */
.tabs{display:flex;gap:4px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{min-height:48px;padding:0 16px;border:none;border-bottom:3px solid transparent;background:transparent;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.split{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.clist{display:flex;flex-direction:column;gap:6px}
.clist button{justify-content:space-between}
.clist button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.stable{list-style:none;margin:0;padding:0}
.stable li{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.thumb{width:44px;height:44px;border-radius:8px;background:var(--ph);overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none;font-family:var(--serif);font-weight:600;color:var(--ph-ink)}
.thumb img{width:100%;height:100%;object-fit:cover}
.stable .nm{flex:1 1 160px;font-weight:500}
.stable select{width:auto;min-width:90px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-items:end}
.day{margin-top:14px}
.day h3{font-size:15px;margin-bottom:4px}
table.prev{border-collapse:collapse;width:100%;font-size:14px}
table.prev td,table.prev th{padding:6px 8px;border-top:1px solid var(--line);text-align:left}
.overflow{overflow-x:auto}
.danger-zone{border-color:var(--neg-line)}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:22px;height:22px}
@media (max-width:600px){.bar{padding:10px 16px}.main{padding:16px}.slot{flex-wrap:wrap;gap:10px}.slot .time{width:auto}.foot{padding:10px 16px}.tabs{padding:0 8px}}
</style>

<div id="layer"></div>

<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
'use strict';
/* ---------- utilitaires ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const dstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayStr = () => dstr(new Date());
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); };
const isoWeek = s => { const d = parseD(s); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); };
const weekType = s => ((isoWeek(s) % 2 === 0) === DB.settings.evenIsA) ? 'A' : 'B';
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtLong = s => cap(parseD(s).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'}));
const fmtShort = s => parseD(s).toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
const fmtT = t => { const [h, m] = t.split(':'); return (+h) + ' h ' + m; };
const tMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const titleCase = s => s.toLowerCase().replace(/(^|[\s\-'’])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
const plural = (n, w, p) => n + ' ' + (n > 1 ? (p || w + 's') : w);
const DAYS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const IS_DEMO = /claude/.test(location.hostname);
const APP_VERSION = {n: '2.0', d: '2026-09-27'};
const versionLabel = () => `Version ${APP_VERSION.n} du ${parseD(APP_VERSION.d).toLocaleDateString('fr-FR', {day: 'numeric', month: 'long', year: 'numeric'})}`;

const ICON = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',

function migrate(core) {
  const d = Object.assign(freshDB(), core || {});

  ['classes','students','slots','obs'].forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });

  ['place', 'sep', 'sesRoom', 'lastRoom', 'content', 'chapters', 'appr'].forEach(k => { if (!d[k] || typeof d[k] !== 'object') d[k] = {}; });

const Store = {
  db: null,
  async open() {
    if (!('indexedDB' in window)) return false;
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('suivi-classe', 1);
        r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos'); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
      });
      return true;
    } catch (e) { this.db = null; return false; }
  },
  run(name, mode, fn) {
    return new Promise((res, rej) => {
      if (!this.db) return res(null);
      try { const tx = this.db.transaction(name, mode); const out = fn(tx.objectStore(name)); tx.oncomplete = () => res(out && out.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }
      catch (e) { rej(e); }
    });
  },
  async load() {
    const core = await this.run('kv', 'readonly', s => s.get('db'));
    const photos = {};
    if (this.db) await new Promise((res, rej) => {
      const tx = this.db.transaction('photos', 'readonly'); const rq = tx.objectStore('photos').openCursor();
      rq.onsuccess = () => { const c = rq.result; if (c) { photos[c.key] = c.value; c.continue(); } };
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
    return {core, photos};
  },
  saveCore() { return this.run('kv', 'readwrite', s => s.put(JSON.parse(JSON.stringify(DB)), 'db')); },
  putPhoto(id, url) { return this.run('photos', 'readwrite', s => s.put(url, id)); },
  delPhoto(id) { return this.run('photos', 'readwrite', s => s.delete(id)); },
  async replaceAll() {
    if (!this.db) return;
    await this.run('photos', 'readwrite', s => s.clear());
    await new Promise((res, rej) => { const tx = this.db.transaction('photos', 'readwrite'); const st = tx.objectStore('photos'); Object.entries(PHOTOS).forEach(([k, v]) => st.put(v, k)); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    await this.saveCore();
  }
};
function save() { if (!STORAGE_OK) return; Store.saveCore().catch(() => toast("Enregistrement impossible sur cet appareil. Faites une sauvegarde dès que possible.")); }

  return {s: all.reduce((m, p) => p.s < m ? p.s : m, all[0].s), e: all.reduce((m, p) => p.e > m ? p.e : m, all[0].e)};

function sesState(date, s, FM) {

  if (DB.cancelled[key]) return {k:'cancel'};

  const sl = slotsOn(t);

function slotCard(d, s, FM) {
  const t = todayStr(), c = cls(s.cid), st = sesState(d, s, FM);
  const isNow = d === t && nowMin() >= tMin(s.start) && nowMin() < tMin(s.end);
  const n = studentsOf(s.cid, s.group).length;
  const chip = stateChip(st) || `<span class="status">${st.k === 'empty' ? 'Aucun élève' : 'À venir'}</span>`;
  const right = (isNow ? '<span class="status now">En cours</span>' : '') + chip + (isNow ? '<span class="open">Ouvrir</span>' : '');
  return `<li><button class="slot ${isNow ? 'now' : ''} ${d < t ? 'past' : ''}" data-act="open-slot" data-slot="${s.id}" data-date="${d}" data-long="slot">
    <span class="time">${fmtT(s.start)} – ${fmtT(s.end)}</span>
    <span class="mid"><span class="row" style="gap:10px">${dot(c)}<span class="cls">${esc(c.name)}</span><span class="chip neu">${groupLabel(s.group)}</span></span><span class="small muted">${plural(n, 'élève')}${(() => { const sm = contentSummary(DB.content[d + '|' + s.id], levelOf(c), false); return sm ? ' · ' + esc(sm) : ''; })()}</span></span>
    ${right}</button></li>`;
}

/* ---------- vue : semaine ---------- */
function viewWeek() {
  const t = todayStr(), mon = mondayOf(V.date), FM = fillMap();
  const wt = weekType(mon);
  const days = [0, 1, 2, 3, 4, 5].map(i => addDays(mon, i));
  const sat = DB.slots.some(x => x.day === 6 && (x.week === 'all' || x.week === wt) && cls(x.cid));
  const shown = sat ? days : days.slice(0, 5);
  const valid = DB.slots.filter(x => cls(x.cid));
  const t0 = valid.length ? Math.floor(Math.min(...valid.map(x => tMin(x.start))) / 60) * 60 : 480;
  const t1 = valid.length ? Math.ceil(Math.max(...valid.map(x => tMin(x.end))) / 60) * 60 : 1020;
  const nb = (IS_DEMO ? 1 : 0) + (backupDue() && !IS_DEMO ? 1 : 0) + (!STORAGE_OK && !IS_DEMO ? 1 : 0);
  const avail = window.innerHeight - 57 - 80 - 40 - 64 - 34 - nb * 84;
  const PPM = Math.max(0.8, Math.min(1.6, avail / Math.max(60, t1 - t0)));
  const H = (t1 - t0) * PPM;
  let todo = 0, started = 0;
  const cols = shown.map(d => {
    const hol = holidayOn(d), sl = slotsOn(d);
    const wd = parseD(d);
    const head = `<div class="tt-dh ${d === t ? 'today' : ''}">${DAYS[wd.getDay()].slice(0, 3)}. <b>${wd.getDate()}</b></div>`;
    if (hol) return {head, body: `<div class="tt-col" style="height:${H}px"><div class="tt-hol">${esc(hol.n)}</div></div>`};
    // chevauchements : répartir côte à côte
    const lanes = []; sl.forEach(x => { let i = lanes.findIndex(end => end <= x.start); if (i < 0) { i = lanes.length; lanes.push(x.end); } else lanes[i] = x.end; x._lane = i; });
    const nl = Math.max(1, lanes.length);
    const blocks = sl.map(x => {
      const c = cls(x.cid), st = sesState(d, x, FM);
      if (st.k === 'none' || st.k === 'part') todo++;
      if (st.k !== 'future' && st.k !== 'cancel') started++;
      const isNow = d === t && nowMin() >= tMin(x.start) && nowMin() < tMin(x.end);
      const top = (tMin(x.start) - t0) * PPM, h = (tMin(x.end) - tMin(x.start)) * PPM - 4;
      const w = 100 / nl;
      const g = x.group === 'all' ? 'Classe entière' : 'Demi-groupe ' + x.group;
      return `<button class="blk ${hasEval(DB.content[d + '|' + x.id]) ? 'has-eval' : ''} ${d < t ? 'past' : ''} ${isNow ? 'now' : ''} ${st.k === 'cancel' ? 'cancel' : ''} ${h < 58 ? 'short' : ''}" style="top:${top}px;height:${h}px;left:calc(${x._lane * w}% + 2px);width:calc(${w}% - 4px);--cc:${ccol(c)}" data-act="open-slot" data-slot="${x.id}" data-date="${d}" data-long="slot" aria-label="${esc(c.name + ', ' + g + ', ' + fmtT(x.start))}">
        <span class="bc">${esc(c.name)}${x.group === 'all' ? '' : ` <span class="bgrp">${x.group}</span>`}</span><span class="bg">${(() => { const ct = DB.content[d + '|' + x.id]; const sm = contentSummary(ct, levelOf(c), true); return sm ? esc(sm) : fmtT(x.start) + ' – ' + fmtT(x.end); })()}</span>${hasEval(DB.content[d + '|' + x.id]) ? '<span class="evb">Évaluation</span>' : ''}${stateChip(st)}</button>`;
    }).join('');
    return {head, body: `<div class="tt-col" style="height:${H}px">${blocks}</div>`};
  });
  const hours = []; for (let m = t0; m <= t1; m += 60) hours.push(`<span style="top:${(m - t0) * PPM}px">${m / 60} h</span>`);
  const isCur = mon === mondayOf(t);
  const sub = `Semaine ${wt} · ` + (todo ? `<strong class="todo">${plural(todo, 'séance')} à compléter</strong>` : started ? 'Tout est à jour' : 'Aucune séance commencée');
  const endD = parseD(shown[shown.length - 1]);
  const title = `Du ${parseD(mon).getDate()} ${parseD(mon).getMonth() === endD.getMonth() ? '' : parseD(mon).toLocaleDateString('fr-FR', {month:'short'}) + ' '}au ${endD.toLocaleDateString('fr-FR', {day:'numeric', month:'long'})}`;
  let body = banners();
  if (!DB.classes.length) body += welcomeCard();
  else if (!valid.length) body += `<div class="empty"><p>Aucun créneau dans l'emploi du temps.</p><button class="btn" data-act="settings" data-tab="edt">${ICON.cal}Saisir l'emploi du temps</button></div>`;
  else body += `<div class="tt-wrap"><div class="tt" style="--n:${shown.length};--hour:${60 * PPM}px">
      <div></div>${cols.map(c => c.head).join('')}
      <div class="tt-times" style="height:${H}px">${hours.join('')}</div>${cols.map(c => c.body).join('')}
    </div></div>
    <p class="small muted" style="margin:0">Toucher un créneau : ouvrir la séance · Appui long : le marquer comme annulé.</p>`;
  return `${tabBar('edt')}
  <header class="bar">
    <button class="btn icon-btn" data-act="week" data-n="-7" aria-label="Semaine précédente">${ICON.back}</button>
    <div class="ttl"><h1>${title}</h1><div class="sub">${sub}</div></div>
    <button class="btn icon-btn" data-act="week" data-n="7" aria-label="Semaine suivante">${ICON.next}</button>
    ${isCur ? '' : '<button class="btn ghost" data-act="week" data-n="0">Cette semaine</button>'}
    <span class="grow"></span>
    ${modeSeg('week')}
    <button class="btn" data-act="other">Autre classe</button>
  </header>
  <main class="main"><div class="wrap" style="max-width:1280px">${body}</div></main>`;
}
function slotMenu(slotId, date) {
  const x = DB.slots.find(y => y.id === slotId); if (!x) return;
  const c = cls(x.cid), key = date + '|' + x.id, canc = !!DB.cancelled[key];
  openModal(`<h2 class="row" style="gap:10px">${dot(c)}${esc(c.name)} · ${groupLabel(x.group)}</h2>

function welcomeCard() {

/* ---------- vue : grille ---------- */
function viewGrid() {
  const ses = V.ses, c = cls(ses.cid);
  const list = studentsOf(ses.cid, ses.group), sum = sesSummary(ses.key);
  const compact = list.length > 24;
  const ckAll = checkItems(ses), ckSet = new Set([...ckAll.catch.map(x => x.sid), ...ckAll.mat.map(x => x.sid), ...ckAll.dev.map(x => x.sid)]);
  let abs = 0, seen = 0;
  const tiles = list.map(s => {
    const r = sum[s.id] || {}; if (r.abs) abs++; else if (r.pos || r.neg || r.ras) seen++;
    const name = compact ? `${esc(s.first)} ${esc((s.last || '')[0] || '')}.` : `${esc(s.first)} <span>${esc(s.last)}</span>`;
    const chips = (r.pos ? `<span class="chip pos">+${r.pos}</span>` : '') + (r.neg ? `<span class="chip neg">−${r.neg}</span>` : '') + (r.dv ? `<span class="chip dv" title="${CAT[r.dv].l}">${compact ? 'Dev.' : 'Devoir'}</span>` : '') + (r.ras ? `<span class="chip neu">RAS</span>` : '');
    return `<button class="tile ${r.abs ? 'is-absent' : ''}" data-act="tile" data-long="fiche" data-sid="${s.id}" aria-label="${esc(s.first + ' ' + s.last)}">
      <span class="ph">${photoHTML(s)}${r.abs ? '<span class="chip dark tag-abs">Absent/e</span>' : ''}${ckSet.has(s.id) ? '<span class="tag-chk" title="À vérifier">!</span>' : ''}</span>
      <span class="nm">${name}</span><span class="cnt">${chips}</span></button>`;
  }).join('');
  const present = list.length - abs;
  const body = list.length ? `<div class="tiles ${compact ? 'compact' : ''}">${tiles}</div>`
    : `<div class="empty"><p>Aucun élève dans ${ses.group === 'all' ? 'cette classe' : 'ce demi-groupe'}.</p><button class="btn" data-act="settings" data-tab="classes" data-cid="${c.id}">Ajouter des élèves</button></div>`;
  return `${sesHeader(ses, `${eyeBtn(true)}
    <button class="btn" data-act="export" data-cid="${c.id}">${ICON.down}Export</button>
    <button class="btn primary" data-act="rasrest">${ICON.check}Reste de la classe : RAS</button>`)}
  <main class="main">${apprCard(ses)}${body}</main>
  <footer class="foot"><span>Toucher une photo : noter une observation (puis élève suivant)</span><span>Appui long : fiche de l'élève</span><span class="grow"></span><span>${present} présents · ${plural(abs, 'absent')} · ${Math.max(0, present - seen)} non observés</span></footer>`;
}

/* ---------- panneau d'observation ---------- */

function closeLayer() { $('#layer').innerHTML = ''; P = null; }
function openPanel(sid) { P = {sid, sel: new Set()}; renderPanel(); }
function openGroupPanel(sids, label) { P = {sids, label, sel: new Set()}; renderPanel(); }
function renderPanel() {
  if (P.sids) return renderGroupPanel();
  const s = stu(P.sid), ses = V.ses, c = cls(s.cid);
  const list = DB.obs.filter(o => o.ses === ses.key && o.sid === s.id);
  const isAbs = list.some(o => o.cat === 'absent');
  const catBtns = t => CATS.filter(x => x.t === t && !PANEL_HIDE.has(x.k)).map(x => `<button type="button" class="cat ${t}" data-act="p-tog" data-cat="${x.k}" aria-pressed="${P.sel.has(x.k)}">${esc(x.l)}</button>`).join('');
  const done = list.length ? `<div><div class="lbl" style="margin-bottom:6px">Déjà noté pendant cette séance</div><div class="done">${list.map(o => {
      const c2 = CAT[o.cat]; const sign = c2.t === 'pos' ? '+ ' : c2.t === 'neg' ? '− ' : '';
      return `<span class="chip ${DV.has(o.cat) ? 'dv' : c2.t}">${sign}${esc(c2.l)}<button type="button" data-act="p-del" data-oid="${o.id}" aria-label="Retirer ${esc(c2.l)}">×</button></span>`; }).join('')}</div></div>` : '';
  $('#layer').innerHTML = `<div class="scrim" data-act="p-close"></div>
  <aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="p-name">
    <div class="scroll">
      <div class="hd">
        <div class="avatar">${photoHTML(s)}</div>
        <div style="flex:1 1 140px;min-width:0"><h2 id="p-name">${esc(s.first + ' ' + s.last)}</h2><div class="small muted">${esc(c.name)}${s.group ? ' · ' + s.group : ''}</div></div>
        ${bilanMode() ? (() => { const pv = bilanStep(s.id, -1), nx = bilanStep(s.id, 1); const all = studentsOf(ses.cid, ses.group).filter(x => x.id === s.id || !isAbsentIn(ses.key, x.id)); const i = all.findIndex(x => x.id === s.id);
          return `<div class="pnav"><button class="btn icon-btn" data-act="p-step" data-d="-1" ${pv ? '' : 'disabled'} aria-label="Élève précédent">${ICON.back}</button><span class="small muted">${i + 1} / ${all.length}</span><button class="btn icon-btn" data-act="p-step" data-d="1" ${nx ? '' : 'disabled'} aria-label="Élève suivant">${ICON.next}</button></div>`; })() : ''}
        <button class="btn" data-act="p-fiche">Fiche</button>
        <button class="btn icon-btn ghost" data-act="p-close" aria-label="Fermer">${ICON.close}</button>
      </div>
      <div class="row"><button class="btn" data-act="p-ras">RAS</button><button class="btn" data-act="p-abs">${isAbs ? "Retirer l'absence" : 'Absent/e'}</button><button class="btn" data-act="p-catch">À rattraper…</button></div>
      ${(() => { const sc = studentChecks(ses, s.id); const n = sc.catch.length + sc.mat.length + sc.dev.length; if (!n) return '';
        return `<div class="pchk"><div class="lbl">À vérifier pour ${esc(s.first)}</div>${sc.catch.map(x => `<div class="row pchkrow"><span>${esc(catchText(x))}</span><button class="btn" data-act="catch-done" data-id="${x.id}">Rattrapé</button></div>`).join('')}${sc.dev.map(o => `<div class="row pchkrow"><span>${CAT[o.cat].l} le ${fmtShort(o.date)}</span><button class="btn" data-act="obs-seen" data-oid="${o.id}">Vu</button></div>`).join('')}${sc.mat.map(o => `<div class="row pchkrow"><span>Oubli de matériel le ${fmtShort(o.date)}</span><button class="btn" data-act="obs-seen" data-oid="${o.id}">Vu</button></div>`).join('')}</div>`; })()}
      ${done}
      <div><div class="sec-t pos">+ Positif</div><div class="cats">${catBtns('pos')}</div></div>
      <div><div class="sec-t neg">− Négatif</div><div class="cats">${catBtns('neg')}</div></div>
      <label class="f" for="p-note" style="display:block">Commentaire <span class="muted" style="font-weight:400">(facultatif, obligatoire pour « Comportement »)</span></label>
      <textarea id="p-note" rows="3" placeholder="Ce qui s'est passé…"></textarea>
      <p class="err" id="p-err" hidden></p>

    <div class="ft"><button class="btn" data-act="p-close">Annuler</button><button class="btn ink" data-act="p-save" id="p-save" ${P.sel.size ? '' : 'disabled'}>Enregistrer</button></div>

function addObs(sid, cat, note = '', t = Date.now()) {

/* ---------- vue : fiche élève ---------- */
function viewFiche() {
  const s = stu(V.sid); if (!s) { back(); return ''; }
  const c = cls(s.cid), periods = periodsFor(c);
  if (V.p == null || V.p >= periods.length) V.p = currentPeriodIndex(periods);
  const per = periods[V.p];
  const obs = DB.obs.filter(o => o.sid === s.id && o.date >= per.s && o.date <= per.e).sort((a, b) => b.date.localeCompare(a.date) || b.t - a.t);
  const cnt = {}; obs.forEach(o => cnt[o.cat] = (cnt[o.cat] || 0) + 1);
  const tot = t => obs.filter(o => CAT[o.cat]?.t === t).length;
  const bars = CATS.filter(x => (x.t === 'pos' || x.t === 'neg') && cnt[x.k]).sort((a, b) => cnt[b.k] - cnt[a.k]);
  const max = Math.max(1, ...bars.map(b => cnt[b.k]));
  const seg = periods.map((p, i) => `<button type="button" data-act="period" data-i="${i}" aria-pressed="${i === V.p}">${esc(p.n)}</button>`).join('');
  const log = obs.length ? `<ul class="log">${obs.map(o => `<li><span class="d">${fmtShort(o.date)}</span>${catChip(o.cat)}<span class="n">${esc(o.note)}${o.note ? '' : `<span class="muted small">${esc(o.lbl || '')}</span>`}</span><button type="button" class="x" data-act="o-del" data-oid="${o.id}">Supprimer</button></li>`).join('')}</ul>`
    : `<p class="muted">Aucune observation sur cette période.</p>`;
  return `
  <header class="bar">
    <button class="btn ghost" data-act="back">${ICON.back}Retour</button>
    <div class="ttl"><h1>${esc(s.first + ' ' + s.last)}</h1><div class="sub">${esc(c.name)}${s.group ? ' · ' + s.group : ''}</div></div>
    <span class="grow"></span>
    <div class="seg" role="group" aria-label="Période">${seg}</div>
    <button class="btn" data-act="stu-edit" data-sid="${s.id}">Modifier</button>
    <button class="btn" data-act="export-stu">${ICON.down}Exporter</button>
  </header>
  <main class="main"><div class="fiche">
    <aside style="display:flex;flex-direction:column;gap:12px">
      <div class="bigph">${photoHTML(s)}</div>
      <span class="btn filebtn">${PHOTOS[s.id] ? 'Changer la photo' : 'Ajouter une photo'}<input type="file" accept="image/*" data-chg="photo" data-sid="${s.id}" aria-label="Photo de l'élève"></span>
      <div class="stats">
        <div class="stat pos"><b>+${tot('pos')}</b><span>positives</span></div>
        <div class="stat neg"><b>−${tot('neg')}</b><span>négatives</span></div>
        <div class="stat"><b>${cnt.ras || 0}</b><span class="muted">séances RAS</span></div>
        <div class="stat"><b>${cnt.absent || 0}</b><span class="muted">${(cnt.absent || 0) > 1 ? 'absences' : 'absence'}</span></div>
      </div>
      <p class="small muted" style="margin:0">${esc(per.n)} : du ${fmtShort(per.s)} au ${fmtShort(per.e)}</p>
    </aside>
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <section class="card"><h2 style="font-size:16px;margin-bottom:12px">Répartition</h2>${bars.length ? `<div class="bars">${bars.map(b => `<div class="barrow"><span>${esc(b.l)}</span><span class="tr"><span class="fl ${b.t}" style="display:block;width:${(cnt[b.k] / max * 100).toFixed(1)}%"></span></span><b>${cnt[b.k]}</b></div>`).join('')}</div>` : '<p class="muted" style="margin:0">Rien à afficher pour l\'instant.</p>'}</section>
      ${(() => { const cs = DB.catchup.filter(x => x.sid === s.id).sort((a, b) => b.date.localeCompare(a.date)); if (!cs.length) return '';
        return `<section class="card"><h2 style="font-size:16px;margin-bottom:8px">Rattrapages</h2><ul class="log">${cs.map(x => `<li><span class="d">${fmtShort(x.date)}</span><span class="n">${esc(catchText(x))}</span>${x.done ? `<span class="chip pos">Rattrapé le ${fmtShort(x.done)}</span>` : '<span class="chip warn">En cours</span>'}<button type="button" class="x" data-act="catch-toggle" data-id="${x.id}">${x.done ? 'Rouvrir' : 'Rattrapé'}</button></li>`).join('')}</ul></section>`; })()}
      <section class="card"><h2 style="font-size:16px;margin-bottom:8px">Chronologie</h2>${log}</section>
    </div>
  </div></main>`;
}

/* ---------- vue : réglages ---------- */

function parseList(text, cid) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) return {rows: [], dup: 0};
  const sep = lines.some(l => l.includes('\t')) ? '\t' : lines.some(l => l.includes(';')) ? ';' : lines.some(l => l.includes(',')) ? ',' : null;
  let rows = lines.map(l => (sep ? l.split(sep) : [l]).map(x => x.replace(/^"|"$/g, '').trim()));
  if (/nom|pr[ée]nom|[ée]l[èe]ve/i.test(rows[0].join(' ')) && rows.length > 1) rows = rows.slice(1);
  const normG = g => { g = String(g || '').toUpperCase(); return /1/.test(g) ? 'G1' : /2/.test(g) ? 'G2' : ''; };
  const out = [];
  rows.forEach(r => {
    let last = '', first = '', group = '';
    const cells = r.filter(x => x !== '');
    if (!cells.length) return;
    if (cells.length >= 2 && !/^g?\s*[12]$/i.test(cells[1])) { last = cells[0]; first = cells[1]; group = normG(cells[2]); }
    else {
      const words = cells[0].split(/\s+/);
      const up = words.filter(w => w.length > 1 && w === w.toUpperCase() && /\p{L}/u.test(w));
      if (up.length && up.length < words.length) { last = up.join(' '); first = words.filter(w => !up.includes(w)).join(' '); }
      else { last = words.slice(-1).join(' '); first = words.slice(0, -1).join(' '); }
      if (cells[1]) group = normG(cells[1]);
    }
    if (!first || !last) return;
    out.push({last: titleCase(last), first: titleCase(first), group});
  });
  const have = new Set(DB.students.filter(s => s.cid === cid).map(s => norm(s.last + ' ' + s.first)));
  const fresh = out.filter(r => !have.has(norm(r.last + ' ' + r.first)));
  return {rows: fresh, dup: out.length - fresh.length};
}

const TYPE_L = {pos:'Positif', neg:'Négatif', neu:'Neutre', abs:'Absence'};
function buildExport(cid, per, type, sid) {
  const studs = sid ? [stu(sid)] : studentsOf(cid);
  const ids = new Set(studs.map(s => s.id));
  const obs = DB.obs.filter(o => ids.has(o.sid) && o.date >= per.s && o.date <= per.e);
  if (type === 'detail') {
    const rows = [['Date','Créneau','Nom','Prénom','Groupe','Type','Observation','Commentaire']];
    obs.sort((a, b) => a.date.localeCompare(b.date) || a.t - b.t).forEach(o => { const s = stu(o.sid); rows.push([o.date.split('-').reverse().join('/'), o.lbl || '', s.last, s.first, s.group || '', TYPE_L[CAT[o.cat].t], CAT[o.cat].l, o.note || '']); });
    return csv(rows);
  }
  const cats = CATS.filter(c => c.t === 'pos' || c.t === 'neg');
  const rows = [['Nom','Prénom','Groupe','Positif','Négatif','RAS','Absences', ...cats.map(c => c.l), 'Commentaires']];
  studs.forEach(s => {
    const mine = obs.filter(o => o.sid === s.id); const n = k => mine.filter(o => o.cat === k).length;
    rows.push([s.last, s.first, s.group || '', mine.filter(o => CAT[o.cat].t === 'pos').length, mine.filter(o => CAT[o.cat].t === 'neg').length, n('ras'), n('absent'), ...cats.map(c => n(c.k)), mine.filter(o => o.note).map(o => fmtShort(o.date) + ' : ' + o.note).join(' | ')]);
  });
  return csv(rows);
}
async function deliver(filename, text, mime, mode) {
  if (IS_DEMO) { toast("Les fichiers ne s'enregistrent pas dans la version d'essai : cette fonction marche dans l'app installée."); return false; }
  const blob = new Blob([text], {type: mime});
  if (mode === 'share') {
    const f = new File([blob], filename, {type: mime});
    if (navigator.canShare && navigator.canShare({files: [f]})) {
      try { await navigator.share({files: [f], title: filename}); return true; }
      catch (e) { if (e.name === 'AbortError') return false; }
    }
    toast("Le partage n'est pas disponible ici : le fichier est enregistré sur l'appareil.");
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  return true;
}

function squareCrop(src, x, y, w, h) {
  const S = 360, side = Math.min(w, h);

/* ---------- salles, plans, projection ---------- */
const ROOM_W = 1000, ROOM_H = 620;
const ITEM_DIM = {ilot: [190, 130], double: [240, 170], simple: [190, 78]};
const ITEM_LABEL = {ilot: 'Îlot de 4', double: 'Paillasses face à face (vitre)', simple: 'Paillasse face au tableau'};
function defaultRooms() {
  let n;
  const mk = (name, kind, items) => ({id: uid(), name, kind, board: 'top', desk: {x: 840, y: 36}, items});
  const it = (type, x, y) => ({id: uid(), type, x, y, rot: 0, nums: type === 'double' ? [++n, ++n] : [++n]});
  const ilots = () => { n = 0; const a = []; [80, 265, 450].forEach(y => [70, 405, 740].forEach(x => a.push(it('ilot', x, y)))); return a; };
  const doubles = () => { n = 0; const a = []; [80, 350].forEach(y => [60, 380, 700].forEach(x => a.push(it('double', x, y)))); return a; };
  const simples = () => { n = 0; const a = []; [80, 230, 380].forEach(y => [30, 270, 510, 750].forEach(x => a.push(it('simple', x, y)))); return a; };
  return [mk('PC 1', 'ilots', ilots()), mk('PC 2', 'ilots', ilots()), mk('PC 3', 'ilots', ilots()), mk('PC 4', 'ilots', ilots()),
          mk('PC 5', 'paillasses', doubles()), mk('PC 6', 'paillasses', simples())];
}
const roomById = id => DB.rooms.find(r => r.id === id);
const itemDims = it => { const [w, h] = ITEM_DIM[it.type]; return it.rot ? [h, w] : [w, h]; };
const unitSize = it => it.type === 'ilot' ? 4 : 2;
const unitWord = it => it.type === 'ilot' ? 'Îlot' : 'Paillasse';
const kindLabel = r => r.kind === 'ilots' ? 'Îlots' : 'Paillasses';
function roomUnits(room) { const u = []; room.items.forEach(it => it.nums.forEach(n => u.push({num: String(n), size: unitSize(it), it}))); return u.sort((a, b) => a.num - b.num); }
const roomNums = room => new Set(roomUnits(room).map(u => u.num));
const pkey = (cid, group, room) => `${cid}|${group}|${room.kind === 'ilots' ? 'ilots' : room.id}`;
function getPlace(cid, group, room, create) {
  const k = pkey(cid, group, room); let p = DB.place[k];
  if (!p && create) p = DB.place[k] = {g: {}, flags: {}, upd: null};
  if (p) { p.g = p.g || {}; p.flags = p.flags || {}; }
  return p;
}
const validSid = (sid, cid, group) => { const s = sid && stu(sid); return s && s.cid === cid && (group === 'all' || s.group === group) ? s : null; };
function placedSet(pl, room, cid, group) {
  const nums = roomNums(room), out = new Set();
  if (pl) Object.entries(pl.g).forEach(([n, arr]) => { if (nums.has(n)) (arr || []).forEach(sid => { if (validSid(sid, cid, group)) out.add(sid); }); });
  return out;
}
function seatOf(pl, sid) { for (const [n, arr] of Object.entries(pl.g)) { const i = (arr || []).indexOf(sid); if (i >= 0) return {num: n, i}; } return null; }
function touchNums(pl, nums) { nums.forEach(n => { if (n != null && pl.flags[n]) delete pl.flags[n]; }); pl.upd = todayStr(); }
function moveTo(pl, sid, num, i) {
  num = String(num); const from = seatOf(pl, sid); const g = pl.g[num] || (pl.g[num] = []);
  const other = g[i] || null;
  if (from) pl.g[from.num][from.i] = (other && other !== sid) ? other : null;
  g[i] = sid; touchNums(pl, [num, from && from.num]);
}
function removeFrom(pl, sid) { const f = seatOf(pl, sid); if (f) { pl.g[f.num][f.i] = null; touchNums(pl, [f.num]); } }
const sepPairs = cid => (DB.sep[cid] || []).filter(p => stu(p[0]) && stu(p[1]));
function conflictNums(pl, cid, room) {
  const out = new Set(); if (!pl) return out; const pairs = sepPairs(cid); if (!pairs.length) return out;
  roomNums(room).forEach(n => { const m = new Set(pl.g[n] || []); if (pairs.some(([a, b]) => m.has(a) && m.has(b))) out.add(n); });
  return out;
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function randomPlacement(cid, group, room) {
  const ids = studentsOf(cid, group).map(s => s.id), units = roomUnits(room);
  if (!units.length) return null;
  const size = room.kind === 'ilots' ? 4 : 2;
  let k = Math.min(units.length, Math.max(1, Math.ceil(ids.length / size)));
  while (k < units.length && units.slice(0, k).reduce((a, u) => a + u.size, 0) < ids.length) k++;
  const use = units.slice(0, k), cap = use.reduce((a, u) => a + u.size, 0), n = Math.min(ids.length, cap);
  const sizes = use.map(() => 0); let left = n, i = 0;
  while (left > 0 && i < 100000) { const j = i % k; if (sizes[j] < use[j].size) { sizes[j]++; left--; } i++; }
  const pairs = sepPairs(cid); let best = null, bestC = Infinity;
  for (let tr = 0; tr < 500 && bestC > 0; tr++) {
    const sh = shuffle(ids), g = {}; let p = 0;
    use.forEach((u, j) => { const arr = sh.slice(p, p + sizes[j]); p += sizes[j]; while (arr.length < u.size) arr.push(null); g[u.num] = arr; });
    let c = 0; Object.values(g).forEach(arr => { const m = new Set(arr); pairs.forEach(([a, b]) => { if (m.has(a) && m.has(b)) c++; }); });
    if (c < bestC) { best = g; bestC = c; }
  }
  return {g: best, conflicts: bestC, unplaced: ids.length - n};
}

/* rendu d'une salle (plan, projection, édition, miniature) */
const pct = (v, tot) => (v / tot * 100).toFixed(3) + '%';
const shortName = s => esc(s.first) + ' ' + esc((s.last || '')[0] || '') + '.';
function seatHTML(s, num, i, o) {

function unitHTML(room, it, num, o) {

  return room.items.some(it => { if (it.id === skip) return false; const [iw, ih] = itemDims(it); return hit(me, {x: it.x, y: it.y, w: iw, h: ih}); });

function detectLevel(name) {

function nextSession(cid, key, group, sameTrack) {

function firstSessionOnOrAfter(cid, date, group) { return classSessions(cid).find(s => !s.cancelled && s.date >= date && compat(s.group, group)) || null; }

    if (!compat(p.group, ses.group)) return;

/* décaler : chaque séance suivante (même groupe) prend le contenu de la précédente */
function shiftAt(cid, group, startKey, firstContent) {
  const list = classSessions(cid).filter(s => !s.cancelled && s.group === group);
  const i = list.findIndex(s => s.key === startKey); if (i < 0) return 0;
  const after = list.slice(i);
  let last = -1; after.forEach((s, j) => { if (DB.content[s.key]) last = j; });
  const moving = after.slice(0, last + 1).map(s => DB.content[s.key] || null);
  if (last + 1 >= after.length && moving.length) { /* pas de séance libre à la fin de l'année : on garde le dernier contenu fusionné */
    const tail = moving.pop(); const prev = moving[moving.length - 1];
    if (prev && tail) { prev.items = prev.items.concat(tail.items); prev.hw = prev.hw.concat(tail.hw); }
  }
  after.forEach((s, j) => { if (j <= moving.length) delete DB.content[s.key]; });
  if (after[0] && firstContent) DB.content[after[0].key] = firstContent;
  moving.forEach((ct, j) => { const tgt = after[j + 1]; if (tgt && ct) DB.content[tgt.key] = ct; });
  SESS_CACHE = {};
  return moving.length;
}

    const key = s => norm(s).split(' ').sort().join(' ');
    const idx = new Map(list.map(s => [key(s.last + ' ' + s.first), s]));
    for (const f of files) { const s = idx.get(key(f.name.replace(/\.[^.]+$/, ''))); if (s && await setPhoto(s.id, f)) ok++; else miss.push(f.name); }
    render(); toast(`${plural(ok, 'photo')} associée${ok > 1 ? 's' : ''}` + (miss.length ? ` · ${miss.length} non reconnue${miss.length > 1 ? 's' : ''}` : ''));
  },
  group: el => { const s = stu(el.dataset.sid); s.group = el.value; save(); render(); },
  'class-pt': el => { cls(el.dataset.cid).pt = el.value; save(); },
  parity: el => { DB.settings.evenIsA = el.checked; save(); render(); },
  hol: el => { const h = DB.settings.holidays[+el.dataset.i]; const v = el.value.trim(); if (!v) return; h[el.dataset.f] = v; if (h.s && h.e && h.e < h.s) h.e = h.s; save(); },
  'period-date': el => { const p = DB.settings.periods[el.dataset.k][+el.dataset.i]; if (el.value) { p[el.dataset.f] = el.value; save(); } },
  restore: el => { const f = el.files[0]; if (f) restoreFrom(f); el.value = ''; },
  'imp-file': el => { const f = el.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { let t = r.result; if (/\uFFFD/.test(t)) { const r2 = new FileReader(); r2.onload = () => { IMP = {text: r2.result, ...parseList(r2.result, V.cid)}; render(); }; r2.readAsText(f, 'windows-1252'); return; } IMP = {text: t, ...parseList(t, V.cid)}; render(); }; r.readAsText(f, 'utf-8'); },
  'ex-cid': el => exportModal(el.value),
  'hw-kind': el => { syncInputs(); CT.hw.kind = el.value; CT.hw.allq = true; renderContent(); },
  'hw-due': el => { syncInputs(); CT.hw.due = el.value; const keep = {}; ['hw-page', 'hw-nums', 'hw-name', 'hw-detail', 'hw-text', 'hw-from', 'hw-to'].forEach(id => { if ($('#' + id)) keep[id] = $('#' + id).value; }); renderContent(); Object.entries(keep).forEach(([id, v]) => { if ($('#' + id)) $('#' + id).value = v; }); },
  'chap-title': el => { const ch = chaptersOf(el.dataset.lvl).find(x => x.n === +el.dataset.n); if (ch) { ch.t = el.value.trim(); save(); } },
  'class-level': el => { const c = cls(el.dataset.cid), v = el.value.trim(); if (c) { c.level = v || null; save(); } },
  'room-name': el => { const r = roomById(V.rid); const v = el.value.trim(); if (r && v) { r.name = v; save(); } },
  trombi: el => { const f = el.files[0]; el.value = ''; if (f) startTrombi(f, el.dataset.cid); },
  'tr-sel': el => { const it = TR.items[+el.dataset.i]; it.sid = el.value; if (el.value && el.value !== 'new' && el.value !== 'skip') it.group = stu(el.value)?.group || it.group; renderKeep(); },
  'tr-name': el => { const it = TR.items[+el.dataset.i]; it[el.dataset.k] = titleCase(el.value.trim()); renderKeep(); }
};
const FORMS = {
  'new-class': () => { const name = $('#nc-name').value.trim(); if (!name) return; const c = {id: uid(), name, pt: $('#nc-pt').value, color: nextColor()}; DB.classes.push(c); V.cid = c.id; V.imp = true; IMP = null; save(); render(); toast('Classe créée. Importez maintenant la liste des élèves.'); },
  'add-stu': f => { const first = titleCase($('#as-first').value.trim()), last = titleCase($('#as-last').value.trim()); if (!first || !last) return; DB.students.push({id: uid(), cid: f.dataset.cid, first, last, group: $('#as-group').value}); save(); render(); $('#as-first')?.focus(); },
  'add-slot': () => {
    const s = {id: uid(), day: +$('#sl-day').value, start: $('#sl-start').value, end: $('#sl-end').value, cid: $('#sl-cid').value, group: $('#sl-group').value, week: $('#sl-week').value};
    if (!s.start || !s.end || s.end <= s.start) { toast("L'heure de fin doit suivre l'heure de début."); return; }
    DB.slots.push(s); save(); const keep = {day: s.day, end: s.end}; render(); $('#sl-day').value = keep.day; $('#sl-start').value = keep.end; toast('Créneau ajouté');
  }
};

document.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; e.preventDefault(); e.stopPropagation(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e); });
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); FORMS[f.dataset.form]?.(f); });
document.addEventListener('keydown', e => {
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && bilanMode() && !$('#modal').innerHTML && !e.target.closest('input, textarea')) { const nx = bilanStep(P.sid, e.key === 'ArrowRight' ? 1 : -1); if (nx) openPanel(nx); return; }
  if (e.key !== 'Escape') return; if ($('#modal').innerHTML) closeModal(); else if (P || CT || CHK) { CT = null; CHK = false; closeLayer(); } else if (V.name === 'proj') ACT['proj-exit'](); });
function openProj(cid, group, rid) { go({name:'proj', cid, group, rid}); try { const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (r && r.catch) r.catch(() => {}); } catch (e) {} }
document.addEventListener('pointerdown', e => {
  const d = e.target.closest('[data-drag]'); if (!d || V.name !== 'roomedit') return;
  const cv = $('#room-canvas'), room = roomById(V.rid); if (!cv || !room) return;
  const r = cv.getBoundingClientRect(); const isDesk = d.dataset.drag === 'desk';
  const obj = isDesk ? room.desk : room.items.find(x => x.id === d.dataset.id); if (!obj) return;
  if (!isDesk) V.selItem = obj.id;
  const [w, h] = isDesk ? [120, 36] : itemDims(obj);
  DRAG = {cp: JSON.stringify(DB), el: d, obj, sx: e.clientX, sy: e.clientY, ox: obj.x, oy: obj.y, k: ROOM_W / r.width, w, h, nx: obj.x, ny: obj.y, moved: false};
  try { d.setPointerCapture(e.pointerId); } catch (er) {}
  e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!DRAG) return;
  const snap = v => Math.round(v / 10) * 10;
  const nx = Math.max(0, Math.min(ROOM_W - DRAG.w, snap(DRAG.ox + (e.clientX - DRAG.sx) * DRAG.k)));
  const ny = Math.max(0, Math.min(ROOM_H - DRAG.h, snap(DRAG.oy + (e.clientY - DRAG.sy) * DRAG.k)));
  if (nx !== DRAG.nx || ny !== DRAG.ny) { DRAG.nx = nx; DRAG.ny = ny; DRAG.moved = true; DRAG.el.style.left = pct(nx, ROOM_W); DRAG.el.style.top = pct(ny, ROOM_H); }
});
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => {
  if (!DRAG) return; const d = DRAG; DRAG = null;
  if (d.moved) { d.obj.x = d.nx; d.obj.y = d.ny; save(); render(); showUndo('Élément déplacé', {cp: d.cp, ph: Object.assign({}, PHOTOS)}); return; }
  render();
}));
let pressXY = null;
document.addEventListener('pointerdown', e => {
  const t = e.target.closest('[data-long]'); if (!t) return; suppressClick = false; pressXY = [e.clientX, e.clientY];
  clearTimeout(longTimer); longTimer = setTimeout(() => {
    suppressClick = true; pressXY = null; if (navigator.vibrate) navigator.vibrate(20);
    if (t.dataset.long === 'fiche') go({name:'fiche', sid: t.dataset.sid});
    else if (t.dataset.long === 'slot') slotMenu(t.dataset.slot, t.dataset.date);
    else if (t.dataset.long === 'unit') unitMenu(t.dataset.num);
    else if (t.dataset.long === 'dv') dvMenu(t.dataset.sid);
  }, 550);
});
document.addEventListener('pointermove', e => { if (pressXY && Math.hypot(e.clientX - pressXY[0], e.clientY - pressXY[1]) > 10) { clearTimeout(longTimer); pressXY = null; } }, true);
['pointerup','pointercancel'].forEach(ev => document.addEventListener(ev, () => { clearTimeout(longTimer); pressXY = null; if (suppressClick) setTimeout(() => { suppressClick = false; }, 150); }, true));
document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea')) e.preventDefault(); });
let resizeT; window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (!DRAG && ['today', 'grid', 'plan', 'proj', 'roomedit'].includes(V.name)) renderKeep(); }, 200); });

async function showPersist() {
  const el = $('#persist-status'); if (!el) return;
  try { const p = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : false; el.textContent = p ? 'Protection du stockage : active (le navigateur ne purgera pas les données de lui-même).' : "Protection du stockage : non accordée. Installez l'app sur l'écran d'accueil pour l'obtenir."; }
  catch (e) { el.textContent = ''; }
}

/* ---------- démarrage ---------- */
async function init() {
  STORAGE_OK = await Store.open();
  if (STORAGE_OK) { try { const {core, photos} = await Store.load(); if (core) DB = migrate(core); PHOTOS = photos || {}; } catch (e) { STORAGE_OK = false; } }
  if (IS_DEMO && !DB.classes.length) { loadDemo(); if (STORAGE_OK) Store.replaceAll().catch(() => {}); }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if (!IS_DEMO && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if (!DB.settings.catchInit && DB.classes.length) { backfillCatchups(); save(); }
  if (!IS_DEMO) restoreNav();
  render();
  if (DB.settings.appVersion !== APP_VERSION.n) {
    const first = !DB.settings.appVersion && !DB.classes.length;
    DB.settings.appVersion = APP_VERSION.n; save();
    if (!first && !IS_DEMO) toast(`Mise à jour installée : ${versionLabel().toLowerCase()}`);
  }
  setInterval(() => { if (V.name === 'today' && !$('#modal').innerHTML && document.visibilityState === 'visible') render(); }, 60000);
}
init();
</script>
